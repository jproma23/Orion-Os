; Diagnostico do mic I2S dos ouvidos - so serial, sem WiFi.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; A senha do OTA e a MESMA do firmware normal (2026-11-10, C4-08): sem isto,
; gravar o diagnostico tiraria a senha da placa - e, depois que ela tem
; senha, nem daria para grava-lo pelo ar.
build_flags = -I ../include

; Gravacao pelo ar (ArduinoOTA, hostname ouvidos). Sem cabo:
;   pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 10.20.20.197
extra_scripts = post:../ota_senha.py
