; OUVIDOS DO ROBO - ESP32 WROOM com 2 microfones INMP441 (I2S) mandando o
; audio por WiFi (TCP 9100) para o Voice Core no Notebook. Ver README.md.
;
; O cabo USB do dono fica no CORPO: este ESP32 se grava PELO AR (OTA).
;   pio run -e ota -t upload          <- normal, sem cabo
;   pio run -e esp32dev -t upload     <- so com cabo (ex.: firmware sem OTA)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Gravacao pelo ar (ArduinoOTA, hostname "ouvidos", UDP 3232).
; O IP vem do DHCP (10.20.20.197 em 2026-10-31). Se mudar:
;   getent hosts ouvidos.local        (no Notebook, que resolve mDNS)
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 10.20.20.197
; Senha do OTA (2026-11-10, C4-08): vem de include/segredos.h, o MESMO
; arquivo que o firmware compila - ver include/segredos.exemplo.h.
extra_scripts = post:ota_senha.py
