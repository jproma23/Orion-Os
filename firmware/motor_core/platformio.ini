; Motor Core - ESP32 dedicado ao motor (EDR-0031), separado do ESP32 de
; sensores (firmware/hardware_core, que continua como esta).
;
; Dono exclusivo da fronteira cmd_vel <-> odom que o no-ponte ROS2 espera.
; UART cabeada com o Pi, NUNCA WiFi (EDR-0031: laco de velocidade sobre
; WiFi produz jitter e o sintoma aparece como Nav2 instavel sem causa
; aparente).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Mesma justificativa do hardware_core: velocidade real do protocolo com
; o Raspberry, nao a serial padrao de debug.
monitor_speed = 250000
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson@^7.2
