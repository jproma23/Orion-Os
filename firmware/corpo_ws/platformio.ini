; Corpo do Fofao - ESP32 falando WebSocket com o Raspberry.
;
; POR QUE ESTE AMBIENTE EXISTE (2026-09-20). O ESP32 do corpo estava rodando
; um firmware WebSocket cujo FONTE NAO EXISTIA: nem no Pi, nem no Windows,
; nem no repositorio. A unica copia era a propria flash do chip - o protocolo
; teve de ser recuperado com `strings` no binario
; (~/backups/firmware_corpo/corpo_websocket_2026-09-20.bin).
;
; Isto aqui e o mesmo firmware reescrito COM fonte, e melhor em quatro
; pontos que o antigo nao cobria (ver src/main.cpp).
;
; NAO E UMA PLACA NOVA: e o MESMO ESP32-D0WD-V3 do hardware_core, com o mesmo
; include/pins.h. O que muda e so o transporte - serial binaria la, WebSocket
; aqui. Os managers (motor+PID, encoder, bussola, DHT, seguranca) sao
; REAPROVEITADOS do hardware_core via build_flags, e nao copiados: duas
; copias divergiriam na primeira correcao que alguem fizesse so de um lado.

[env:corpo_ws]
platform = espressif32
board = esp32dev
framework = arduino

; 115200 e o baud do MONITOR (log de boot), nao de protocolo: aqui os dados
; vao por WiFi. E o mesmo que o firmware antigo usava, entao quem abrir o
; monitor por costume continua vendo texto legivel em vez de lixo.
monitor_speed = 115200
upload_speed = 921600

; SEM lib_ldf_mode customizado, DE PROPOSITO. chain+ e deep+ fazem o LDF
; reavaliar as dependencias e ele PERDE as bibliotecas do framework - a
; WebSockets deixa de achar WiFi.h e o build morre. Medido: a WebSockets
; compila sozinha no modo padrao e quebra nos dois modos melhores.
; O que os headers vindos por -I precisam esta declarado em lib_deps abaixo.

build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; Os managers moram no hardware_core. Incluir em vez de copiar mantem UMA
    ; fonte de verdade para pinos, PID e encoder.
    -I../hardware_core/include

; O encoder (encoder_pcnt.cpp) e o PID (velocity_pid.cpp) sao .cpp do
; hardware_core - entram na compilacao por aqui.
build_src_filter =
    +<*>
    +<../../hardware_core/src/encoder_pcnt.cpp>
    +<../../hardware_core/src/velocity_pid.cpp>

lib_deps =
    bblanchon/ArduinoJson@^7.2
    adafruit/Adafruit Unified Sensor@^1.1
    adafruit/DHT sensor library@^1.4
    madhephaestus/ESP32Servo@^3.0
    ; Mesma biblioteca que o firmware antigo usava - o backup da flash traz
    ; a string "arduino-WebSocketsServer" no cabecalho HTTP que ele respondia.
    links2004/WebSockets@^2.4
    ; Duas bibliotecas do PROPRIO framework, declaradas a mao porque o LDF
    ; nao as alcanca sozinho:
    ;   EEPROM          - bussola_manager.h guarda a calibracao nela, e o
    ;                     header chega por -I (o LDF nao segue esses).
    ;   WiFiClientSecure - a WebSockets a inclui incondicionalmente no ramo
    ;                     NETWORK_ESP32, mesmo sem usar SSL nenhum aqui.
    ;   Wire            - I2C da bussola, mesmo motivo do EEPROM.
    EEPROM
    Wire
    WiFi
    WiFiClientSecure
