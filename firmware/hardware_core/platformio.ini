; Hardware Core - o "corpo" do Fofao.
;
; A placa mudou em 2026-08-02: o Arduino Mega 2560 MORREU e foi substituido
; por um ESP32-D0WD-V3 (DevKit 38 pinos, 240MHz, dois nucleos, 4MB de flash,
; USB por CP2102). O mapa de pinos novo esta em include/pins.h.
;
; O ambiente antigo [env:megaatmega2560] foi REMOVIDO em vez de comentado: a
; placa nao existe mais, e um alvo que ninguem consegue compilar so serve
; para dar falsa impressao de que ha caminho de volta. O que valia a pena
; guardar daquele ambiente esta preservado nos comentarios abaixo.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 250000 baud e a velocidade REAL do protocolo com o Raspberry - conferir
; sempre que uma ferramenta de bancada em tools/ nao "achar" a placa: varias
; delas ficaram para tras em 115200 e falham parecendo hardware morto.
monitor_speed = 250000

; O CP2102 aguenta bem 921600 na gravacao; se der erro de sincronismo em
; cabo ruim, baixar para 460800.
upload_speed = 921600

build_flags =
    ; O Mega precisava de -D SERIAL_RX_BUFFER_SIZE=512 e TX=256 porque os
    ; buffers padrao do core AVR eram de 64 bytes e ISSO CAUSAVA BUG REAL:
    ; uma mensagem SET_PAN_TILT tem 251 bytes de JSON (255 com STX/ETX+CRC) e
    ; cabia EXATAMENTE uma. Seguindo uma pessoa os comandos chegam em rajada,
    ; a segunda mensagem perdia bytes, o CRC falhava e processarQuadro() dava
    ; return SILENCIOSO, sem ACK. Sintoma: a camera engasgava e perdia o
    ; alvo, sem erro nenhum aparecer.
    ;
    ; No ESP32 esses defines NAO FUNCIONAM - a UART tem FIFO de 128 bytes em
    ; hardware mais um buffer de driver ajustavel so em tempo de execucao.
    ; A protecao equivalente e Serial.setRxBufferSize(1024) ANTES do
    ; Serial.begin(), feita no setup() do main.cpp. Se alguem remover aquela
    ; linha, o bug de 2026-07-26 volta.
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson@^7.2
    adafruit/Adafruit MPU6050@^2.2
    adafruit/Adafruit Unified Sensor@^1.1
    adafruit/DHT sensor library@^1.4
    ; A <Servo.h> do AVR nao existe no ESP32. A ESP32Servo mantem a MESMA API
    ; (attach/write/detach), entao command_executor.h e radar_manager.h so
    ; trocam o #include. Por baixo ela usa o LEDC (PWM em hardware), o que e
    ; melhor que o Servo do Mega: nao disputa timer com nada.
    madhephaestus/ESP32Servo@^3.0
