[project]
name = "orion-os"
version = "0.1.0"
description = "ORION OS - plataforma de robotica modular offline"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pyserial>=3.5",
    # aiohttp e producao nas DUAS maquinas (2026-11-10, achado C6-06): no Pi a
    # webui (motion_core/webui/server.py) e o enlace com o corpo ESP32
    # (motion_core/navigation/ponte_corpo_ws.py); no Notebook o avatar
    # (orion/display/avatar_server.py). Ficava so no extra `display`, entao uma
    # instalacao limpa do Pi nao subia.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pytest-asyncio>=0.23"]
# Voz + IA. `ollama` e `openwakeword` sairam em 2026-11-10: declarados e
# nunca importados (grep no repo inteiro) - a IA e remota (EDR-0021) e nao ha
# palavra de ativacao.
mission = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "piper-tts",
    "openai>=1.0",  # IA remota (EDR-0021), provider padrao
]
# O que o processo de PRODUCAO do Notebook (tools/conversar_jarvis.py, via
# tools/orion-avatar.service) importa alem de `mission` e `vision`
# (2026-11-10, C6-06): sem isto o Notebook nao subia numa instalacao limpa.
#   fastapi/uvicorn/pydantic - API local (tools/orion_api.py)
#   httpx                    - busca na internet (orion/mission/internet.py)
#   mediapipe                - gestos (orion/vision/gestos.py)
#   speechbrain/torch        - quem fala (orion/voice/identificador_locutor.py)
# Instalar: pip install -e ".[mission,vision,notebook]"
notebook = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "mediapipe",
    "speechbrain",
    "torch",
]
vision = [
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "face-recognition>=1.3",
    "face-recognition-models @ git+https://github.com/ageitgey/face_recognition_models",
    # face_recognition_models usa pkg_resources; setuptools >=81 removeu esse
    # modulo (deprecado, remocao prevista p/ 2025-11-30) - fixar <81 ate a
    # lib atualizar. Sem isso, o import de face_recognition trava o processo
    # inteiro com um quit() interno (nao da so ImportError).
    "setuptools<81",
]
# O rosto leve (tools/rosto.py, 2026-11-12): tela preta, dois olhos e uma
# boca em pygame, no lugar do Firefox em kiosk. Era vazio desde que o aiohttp
# foi para as dependencias base (2026-11-10); `pip install -e ".[display]"`
# continua valendo.
display = ["pygame>=2.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

# AS REGRAS SAO ESCOLHIDAS AQUI, e nao herdadas do humor da versao instalada
# (2026-08-03).
#
# Sem esta secao o ruff aplica o conjunto padrao DELE, que muda entre versoes.
# O 0.16 passou a ligar dezenas de familias que ninguem escolheu (YTT, ASYNC,
# S, BLE...) e, ao mesmo tempo, DESLIGOU o `E402` - justamente a regra contra a
# qual este projeto escreveu 105 comentarios `# noqa: E402` nos testes que
# fazem `pytest.importorskip` antes dos imports.
#
# O resultado era um linter que se contradizia: 105 avisos de "noqa inutil"
# apontando para comentarios que estao certos, afogando os problemas de
# verdade. 275 avisos, quase nenhum acionavel - ou seja, ninguem olhava.
#
# Com o conjunto fixado aqui: 275 -> 163, os `noqa` voltam a ser necessarios
# (so 1 E402 escapa) e o que sobra e real, incluindo 8 imports mortos.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle: inclui E402 (import fora do topo), que este repo usa
    "F",   # pyflakes: import morto, variavel nao usada, f-string vazia
    "W",   # espaco em branco
    "I",   # ordem dos imports
    "UP",  # sintaxe que envelheceu (o projeto exige Python >= 3.11)
    "B",   # bugbear: armadilhas comuns
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]   # "." expoe motion_core/ como pacote importavel
markers = ["sim: testes de integracao com simuladores"]
