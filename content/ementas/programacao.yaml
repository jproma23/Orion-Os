materia: programacao
nome: Programação
descricao: 'Da variavel ao sistema que roda sozinho. O robo tem material proprio aqui que
  nenhum curso tem: ele mesmo, com o codigo comentado e o commit ao lado.

  '
niveis:
  basico:
    descricao: Escrever um programa que faz o que voce quis.
    topicos:
    - id: prog.variaveis
      titulo: Variáveis e tipos
      conteudo: Nome, valor, int, float, str e bool; por que o nome escolhido importa.
      aula: programacao.variaveis-python.basico
    - id: prog.entrada-saida
      titulo: Entrada e saída
      conteudo: Print, input, formatacao de texto e conversao de tipo.
      aula: programacao.entrada-saida.basico
    - id: prog.operadores
      titulo: Operadores e expressões
      conteudo: Aritmeticos, comparacao e logicos; precedencia e o erro de dividir inteiro.
      aula: programacao.operadores.basico
    - id: prog.condicionais
      titulo: Condicionais
      conteudo: If, elif, else; a diferenca entre um if depois do outro e um elif.
      aula: programacao.condicionais.basico
    - id: prog.lacos
      titulo: Laços de repetição
      conteudo: For e while; range; break e continue; o laco infinito e como sair dele.
      aula: programacao.lacos.basico
    - id: prog.listas
      titulo: Listas
      conteudo: Criar, percorrer, indexar, fatiar; o indice que comeca em zero.
      aula: programacao.listas.basico
    - id: prog.funcoes
      titulo: Funções
      conteudo: Definir, parametro, retorno, escopo; por que dividir o programa em pedacos.
      aula: programacao.funcoes.basico
    - id: prog.erros
      titulo: Erros e como ler um erro
      conteudo: Ler o traceback de baixo para cima; erro de sintaxe contra erro de execucao.
      aula: programacao.erros.basico
  intermediario:
    descricao: Organizar codigo que outra pessoa vai ler.
    topicos:
    - id: prog.dicionarios
      aula: programacao.dicionarios.intermediario
      titulo: Dicionários e conjuntos
      conteudo: Chave e valor, quando usar dicionario em vez de lista, conjuntos sem repeticao.
    - id: prog.arquivos
      aula: programacao.arquivos.intermediario
      titulo: Arquivos
      conteudo: Ler e escrever texto, o with que fecha sozinho, CSV e JSON.
    - id: prog.modulos
      aula: programacao.modulos.intermediario
      titulo: Módulos e bibliotecas
      conteudo: Import, a biblioteca padrao, pip e ambiente virtual.
    - id: prog.classes
      aula: programacao.classes.intermediario
      titulo: Classes e objetos
      conteudo: Atributo, metodo, self, construtor; quando classe ajuda e quando atrapalha.
    - id: prog.testes
      aula: programacao.testes.intermediario
      titulo: Testes automatizados
      conteudo: Por que testar, o que e um bom teste, e o teste que so passa por sorte.
    - id: prog.git
      aula: programacao.git.intermediario
      titulo: Controle de versão com Git
      conteudo: Commit, branch, merge, e a mensagem de commit que explica o porque.
    - id: prog.depuracao
      aula: programacao.depuracao.intermediario
      titulo: Depuração
      conteudo: Log contra print, isolar o problema, e a falha silenciosa que nao levanta
        erro.
    - id: prog.estruturas-dados
      aula: programacao.estruturas-dados.intermediario
      titulo: Estruturas de dados
      conteudo: Pilha, fila, arvore e grafo; custo de cada operacao.
  avancado:
    descricao: Sistemas que rodam sozinhos, como o proprio robo.
    topicos:
    - id: prog.assincrono
      aula: programacao.assincrono.avancado
      titulo: Programação assíncrona
      conteudo: Async e await, laco de eventos, e por que esperar rede nao pode travar tudo.
    - id: prog.arquitetura
      aula: programacao.arquitetura.avancado
      titulo: Arquitetura e eventos
      conteudo: Modulos que nao se chamam direto; barramento de eventos; o acoplamento que
        se paga depois.
    - id: prog.banco-dados
      aula: programacao.banco-dados.avancado
      titulo: Banco de dados
      conteudo: SQL, tabela, indice, e busca por texto completo sem servidor nenhum.
    - id: prog.redes
      aula: programacao.redes.avancado
      titulo: Redes e protocolos
      conteudo: TCP, HTTP, socket; o socket zumbi que parece vivo e nao entrega nada.
    - id: prog.concorrencia
      aula: programacao.concorrencia.avancado
      titulo: Concorrência
      conteudo: Thread, processo e fila; o que quebra quando duas coisas escrevem ao mesmo
        tempo.
    - id: prog.hardware
      aula: programacao.hardware.avancado
      titulo: Programar hardware
      conteudo: Serial, baud rate, microcontrolador, e o firmware que trava sem avisar.
    - id: prog.ia-aplicada
      aula: programacao.ia-aplicada.avancado
      titulo: IA aplicada
      conteudo: Chamar um modelo, prompt, cota, e por que o local sempre vem antes do remoto.
    - id: prog.orion
      aula: programacao.orion.avancado
      titulo: Estudo de caso - o próprio ORION
      conteudo: 'Como este robo foi feito: os erros reais, o commit que resolveu cada um,
        e o porque escrito no codigo. Material que so ele tem.

        '
    - id: prog.python-objetos
      aula: programacao.python-objetos.avancado
      titulo: Python avançado - objetos e metaprogramação
      conteudo: Classes, decoradores, geradores, o dunder __init__ e o que e metaprogramacao.
    - id: prog.python-assincrono
      aula: programacao.python-assincrono.avancado
      titulo: Python avançado - assíncrono
      conteudo: Asyncio, await, tarefas e o laco de eventos do proprio Python.
    - id: prog.python-performance
      aula: programacao.python-performance.avancado
      titulo: Python avançado - performance
      conteudo: O GIL, profiling, memoria e quando o Python lento basta.
    - id: prog.javascript-nucleo
      aula: programacao.javascript-nucleo.avancado
      titulo: JavaScript avançado - núcleo da linguagem
      conteudo: Tipos dinamicos, prototipos, closures, escopo e o this que muda.
    - id: prog.javascript-assincrono
      aula: programacao.javascript-assincrono.avancado
      titulo: JavaScript avançado - assíncrono
      conteudo: Promises, async/await, o laco de eventos e o callback que trava.
    - id: prog.javascript-moderno
      aula: programacao.javascript-moderno.avancado
      titulo: JavaScript avançado - moderno
      conteudo: ES6+, modulos, destructuring, spread e o codigo que roda no navegador.
    - id: prog.mqtt-protocolo
      aula: programacao.mqtt-protocolo.avancado
      titulo: MQTT - o protocolo
      conteudo: Publish, subscribe, broker, QoS e por que e leve para IoT.
    - id: prog.mqtt-topicos
      aula: programacao.mqtt-topicos.avancado
      titulo: MQTT - tópicos e retenção
      conteudo: Hierarquia de topicos, wildcards, mensagens retidas e sessao.
    - id: prog.mqtt-aplicado
      aula: programacao.mqtt-aplicado.avancado
      titulo: MQTT - na prática
      conteudo: Broker em casa, ESP32 publicando, Node-RED e os erros comuns.
    - id: prog.cpp-moderno
      aula: programacao.cpp-moderno.avancado
      titulo: C++ avançado - moderno
      conteudo: Ponteiros e referencias, smart pointers, move e RAII.
    - id: prog.cpp-templates
      aula: programacao.cpp-templates.avancado
      titulo: C++ avançado - templates e STL
      conteudo: Templates, a STL, vector, map e o custo escondido de cada container.
    - id: prog.cpp-embarcado
      aula: programacao.cpp-embarcado.avancado
      titulo: C++ avançado - embarcado
      conteudo: C++ em microcontrolador, sem excecoes e sem o que nao cabe na RAM.
    - id: prog.c-ponteiros
      aula: programacao.c-ponteiros.avancado
      titulo: C avançado - ponteiros e memória
      conteudo: Endereco, ponteiro, malloc e free, e o uso apos liberar.
    - id: prog.c-embarcado
      aula: programacao.c-embarcado.avancado
      titulo: C avançado - embarcado
      conteudo: C no microcontrolador, registradores, e o firmware que trava sem avisar.
    - id: prog.c-sistemas
      aula: programacao.c-sistemas.avancado
      titulo: C avançado - sistemas
      conteudo: Struct, union, bitwise, pre-processador e por que C roda perto do metal.
    - id: prog.assembly-nucleo
      aula: programacao.assembly-nucleo.avancado
      titulo: Assembly - o núcleo
      conteudo: Registradores, instrucoes, modo de enderecamento e a memoria de maquina.
    - id: prog.assembly-pilha
      aula: programacao.assembly-pilha.avancado
      titulo: Assembly - pilha e chamadas
      conteudo: A pilha, chamada de funcao, convencao de chamada e o que o compilador esconde.
    - id: prog.assembly-pratica
      aula: programacao.assembly-pratica.avancado
      titulo: Assembly - na prática
      conteudo: Ler assembly gerado, otimizar, e quando vale escrever assembly na mao.
