id: biologia.metabolismo-celular.basico
materia: biologia
titulo: Respiração e fotossíntese
nivel: basico
resumo: Como a celula tira energia do alimento e como a planta fabrica o dela.
fonte: Wikipedia, artigos Metabolismo, consultados em 2026-08-14
plano:
  objetivo: Como a celula tira energia do alimento e como a planta fabrica o dela.
  pre_requisitos:
  - Conceito basico de celulas
  - Noorcao de nutrientes
  duracao_min: 10
  fixacao:
  - O que significa metabolismo?
  - Qual a diferenca entre sintese e degradacao no nosso corpo?
  fechamento: Entendemos que o metabolismo e o motor quimico da celula, responsavel por transformar
    substancias para manter a vida.
passos:
- fala: Fala, pessoal! Imagina que a celula do seu corpo e uma fabrica que nao para nunca.
    Para ela funcionar, ela precisa desmontar o que voce come e montar coisas novas o tempo
    todo.
  quadro:
    tipo: titulo
    texto: Respiração e Fotossíntese
- fala: Todas essas transformacoes quimicas que acontecem dentro das celulas tem um nome cientifico.
    A gente chama de metabolismo.
  quadro:
    tipo: texto
    texto: Metabolismo
- fala: 'A palavra vem do grego metabolismos, que significa mudanca ou troca. E exatamente
    isso: a celula fica trocando e transformando substancias o tempo todo.'
  quadro:
    tipo: formula
    texto: metabolismos = mudanca / troca
- fala: 'Essas reacoes quimicas fazem dois trabalhos principais na celula: elas constroem
    estruturas e desmontam nutrientes para gerar o que a celula precisa.'
  quadro:
    tipo: topicos
    texto: 'Trabalhos do metabolismo na celula:'
    itens:
    - Sintese (construir)
    - Degradacao (desmontar nutrientes)
- fala: Sem esse conjunto de reacoes, a vida simplesmente nao existiria. E o metabolismo que
    permite o crescimento e a reproducao das celulas.
  quadro:
    tipo: texto
    texto: 'Base da vida: crescimento e reprodução'
- fala: Além disso, é o metabolismo que mantem as estruturas da celula firmes e ajuda ela
    a dar a resposta certa para o ambiente onde esta.
  quadro:
    tipo: topicos
    texto: 'Funcoes de manutencao:'
    itens:
    - Manter estruturas celulares
    - Adequar respostas ao ambiente
- fala: 'Para fechar: Pense em tudo o que sua celula faz para processar o alimento que voce
    comeu no almoco. Qual e o nome desse conjunto de transformacoes quimicas?'
  quadro:
    tipo: texto
    texto: 'Pergunta: Como chamamos o conjunto de transformacoes quimicas na celula?'
