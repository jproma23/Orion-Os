id: biologia.caracteristicas-vida.basico
materia: biologia
titulo: O que é estar vivo
nivel: basico
resumo: Organizacao, metabolismo, reproducao e resposta ao ambiente; virus e o limite.
fonte: Wikipedia, artigos Vida, consultados em 2026-08-14
plano:
  objetivo: Organizacao, metabolismo, reproducao e resposta ao ambiente; virus e o limite.
  pre_requisitos:
  - Conhecimento basico sobre seres vivos e objetos inanimados
  duracao_min: 10
  fixacao:
  - O que diferencia um ser vivo de um objeto inanimado de acordo com a biologia?
  fechamento: Vimos que a vida depende de um conjunto de caracteristicas biologicas, e que
    os virus desafiam essa definicao por nao terem celulas proprias.
passos:
- fala: Fala serio, como voce sabe que um cachorro esta vivo, mas uma pedra nao esta? A pedra
    nao faz nada disso sozinha, enquanto o cachorro respira, cresce e se mexe.
  quadro:
    tipo: titulo
    texto: O que e estar vivo?
- fala: Na ciencia, a biologia e a area que estuda a vida. Mas sabia que nao existe uma definicao
    unica que todo cientista aceita?
  quadro:
    tipo: texto
    texto: 'Ciencia que estuda a vida: Biologia'
- fala: A ideia mais aceita e que os seres vivos sao sistemas abertos. Eles precisam trocar
    materia e energia com o ambiente para funcionar.
  quadro:
    tipo: texto
    texto: Organismos sao sistemas abertos
- fala: O primeiro ponto fundamental e a organizacao. Todo ser vivo e composto de celulas,
    que sao as menores unidades da vida.
  quadro:
    tipo: topicos
    texto: Caracteristicas dos seres vivos
    itens:
    - Compostos de celulas
    - Manutencao da homeostase
- fala: Depois temos o metabolismo, que sao todas as reacoes quimicas que acontecem no corpo
    para gerar energia, alem do crescimento.
  quadro:
    tipo: topicos
    texto: Metabolismo e Crescimento
    itens:
    - Processos de sinalizacao celular
    - Autossuficiencia
    - Crescimento e ciclo de vida
- fala: Os seres vivos tambem precisam reagir ao mundo. Eles respondem a estimulos e se adaptam
    ao ambiente ao longo do tempo.
  quadro:
    tipo: topicos
    texto: Relacao com o ambiente
    itens:
    - Resposta a estimulos
    - Adaptacao
    - Evolucao
- fala: E claro que para a especie continuar existindo, ocorre a reproducao.
  quadro:
    tipo: texto
    texto: Capacidade de reproducao
- fala: Existem varias formas de vida na Terra. Plantas, animais, fungos, protistas, arqueas
    e bacterias entram nessa lista.
  quadro:
    tipo: topicos
    texto: Formas de vida
    itens:
    - Plantas
    - Animais
    - Fungos
    - Protistas, arqueas e bacterias
- fala: Mas onde entram os virus nessa historia? Eles sao o grande limite da definicao.
  quadro:
    tipo: limpar
- fala: Os virus nao possuem celulas e nao tem metabolismo proprio fora de uma celula hospedeira.
    Por isso, geram tanto debate sobre estarem vivos ou nao.
  quadro:
    tipo: texto
    texto: 'O limite da vida: Virus (sem celulas e sem metabolismo proprio)'
- fala: 'Para pensar e usar o que voce aprendeu: se um virus nao tem celulas nem metabolismo
    proprio fora de outro organismo, ele cumpre os requisitos da biologia para ser considerado
    vivo? O que voce acha?'
