id: biologia.caracteristicas-vida.basico
materia: biologia
titulo: O que é estar vivo
nivel: basico
resumo: Como organização, metabolismo, reprodução e resposta ao ambiente ajudam a reconhecer seres vivos.
fonte: "Wikipedia: Vida, Metabolismo, Reprodução e Homeostase, consultados em 2026-08-09."
plano:
  objetivo: Distinguir características compartilhadas pelos seres vivos e explicar por que um critério isolado não basta.
  pre_requisitos: []
  duracao_min: 14
  fixacao:
    - Por que reprodução sozinha não decide se algo está vivo?
    - Onde o metabolismo aparece no seu dia a dia?
  fechamento: Vida não é uma lista de uma única propriedade; é a organização de processos que mantém um organismo e permite sua continuidade.
passos:
  - fala: "Hoje vamos responder uma pergunta simples de dizer e difícil de fechar: o que faz algo estar vivo?"
    quadro:
      tipo: titulo
      texto: "O que é estar vivo"
  - fala: "Um ser vivo não é apenas algo que se move. Uma planta quase não muda de lugar, mas cresce, troca matéria com o ambiente e responde à luz."
    quadro:
      tipo: texto
      texto: "Movimento não é o teste da vida"
  - fala: "A primeira pista é a organização. Seres vivos têm partes que trabalham juntas, das moléculas às células e aos órgãos."
    quadro:
      tipo: topicos
      texto: "Organização"
      itens:
        - Moléculas formam células
        - Células formam tecidos e organismos
        - As partes realizam funções juntas
  - fala: "A segunda pista é o metabolismo: o conjunto de reações que obtém matéria e energia e as transforma. Comer, respirar e fabricar substâncias entram nessa ideia."
    quadro:
      tipo: texto
      texto: "Metabolismo = transformações de matéria e energia"
  - fala: "Também há regulação. Mesmo quando o ambiente muda, o organismo tenta manter condições internas em uma faixa adequada. Isso é chamado de homeostase."
    quadro:
      tipo: topicos
      texto: "Homeostase"
      itens:
        - Suar ajuda a controlar a temperatura
        - A sede ajuda a corrigir falta de água
  - fala: "Seres vivos crescem e se desenvolvem porque usam matéria, energia e informação genética para construir e renovar suas estruturas."
    quadro:
      tipo: texto
      texto: "Crescer não é apenas ficar maior; é organizar e renovar matéria"
  - fala: "A reprodução permite que a vida continue em novas gerações. Mas ela não é um teste isolado: uma mula estéril continua sendo um ser vivo."
    quadro:
      tipo: texto
      texto: "Reprodução mantém a linhagem, não define sozinha um indivíduo"
  - fala: "Outra pista é a resposta a estímulos. Pupilas mudam com a luz, plantas se orientam e bactérias detectam substâncias do ambiente."
    quadro:
      tipo: texto
      texto: "Estímulo → resposta"
  - fala: "Os vírus deixam o limite interessante. Eles têm material genético e evoluem, mas não têm metabolismo próprio e dependem de uma célula para se reproduzir."
    quadro:
      tipo: topicos
      texto: "O caso dos vírus"
      itens:
        - Têm genes
        - Evoluem
        - Dependem da célula hospedeira
  - fala: "Por isso, em biologia, a pergunta não se resolve procurando uma única marca. Observamos o conjunto de organização, metabolismo, regulação, resposta e continuidade."
    quadro:
      tipo: texto
      texto: "Vida é um conjunto de processos organizados"
