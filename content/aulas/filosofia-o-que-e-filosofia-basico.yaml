id: filosofia.o-que-e-filosofia.basico
materia: filosofia
titulo: O que é filosofia
nivel: basico
resumo: A pergunta como metodo, mito e razao, e por que duvidar e trabalho serio.
fonte: Wikipedia, artigos Filosofia, consultados em 2026-08-14
plano:
  objetivo: A pergunta como metodo, mito e razao, e por que duvidar e trabalho serio.
  pre_requisitos:
  - Curiosidade basica
  duracao_min: 10
  fixacao:
  - O que significa a palavra filosofia?
  fechamento: A filosofia nos ensina que fazer perguntas e o primeiro passo para o conhecimento.
passos:
- fala: Imagina que seu amigo diz que a chuva cai porque o ceu esta triste. Voce aceita isso
    ou tenta entender como a nuvem funciona?
  quadro:
    tipo: titulo
    texto: O que e Filosofia?
- fala: Antigamente, as pessoas usavam os mitos para explicar o mundo. A filosofia nasce quando
    a gente troca o mito pela razao.
  quadro:
    tipo: texto
    texto: Mito vs. Razao
- fala: A palavra filosofia vem do grego antigo e quer dizer amor pela sabedoria.
  quadro:
    tipo: texto
    texto: Philosophia = Amor pela sabedoria
- fala: Dizem que o matematico Pitagoras foi o primeiro a usar essa palavra.
  quadro:
    tipo: texto
    texto: Cunhado por Pitagoras (c. 570 - 495 a.C.)
- fala: Mas o que o filosofo faz de verdade? Ele estuda questoes gerais e fundamentais sobre
    a nossa existencia.
  quadro:
    tipo: topicos
    texto: Temas centrais
    itens:
    - Existencia humana
    - Conhecimento e verdade
    - Valores morais e esteticos
    - Razao e mente
- fala: Para fazer isso, a filosofia usa ferramentas bem especificas. Nao e achismo.
  quadro:
    tipo: limpar
- fala: O primeiro procedimento tecnico e o questionamento. A pergunta e o nosso metodo de
    trabalho.
  quadro:
    tipo: texto
    texto: 1. Questionamento
- fala: Depois vem a discussao critica e o argumento racional. Nao basta falar, tem que ter
    logica.
  quadro:
    tipo: topicos
    texto: Metodo filosofico
    itens:
    - Questionamento
    - Discussao critica
    - Argumento racional
    - Apresentacao sistematica
- fala: Duvidar de tudo nao e frescura, e trabalho serio. Olha o tipo de pergunta classica
    que eles fazem.
  quadro:
    tipo: texto
    texto: Questoes Classicas
- fala: 'Um exemplo: E possivel saber qualquer coisa e provar que se sabe?'
  quadro:
    tipo: texto
    texto: E possivel provar o que sabemos?
- fala: 'Outra pergunta classica: Existe uma maneira melhor de se viver? E melhor ser justo
    ou injusto?'
  quadro:
    tipo: texto
    texto: Como devemos viver? Ser justo ou injusto?
- fala: 'Para terminar, pensa comigo: por que voce acha que questionar as coisas ao nosso
    redor e importante para a ciencia e para a nossa vida?'
  quadro:
    tipo: texto
    texto: 'Pergunta: Por que duvidar e um trabalho serio?'
