id: filosofia.o-que-e-filosofia.basico
materia: filosofia
titulo: O que é filosofia
nivel: basico
resumo: A pergunta como metodo, mito e razao, e por que duvidar e trabalho serio.
fonte: Wikipedia, artigos Pergunta, consultados em 2026-08-09
plano:
  objetivo: A pergunta como metodo, mito e razao, e por que duvidar e trabalho serio.
  pre_requisitos:
  - Entender o que e uma pergunta
  duracao_min: 10
  fixacao:
  - O que diferencia uma pergunta de uma simples afirmacao?
  - Como usamos perguntas no dia a dia?
  fechamento: A filosofia comeca exatamente quando a gente para para fazer perguntas sobre
    o que parece obvio.
passos:
- fala: 'Fala, pessoal! Olha so, imagina que voce chega em casa e pergunta: ''O que tem para
    o jantar?''. Voce esta pedindo uma informacao para alguem, certo?'
  quadro:
    tipo: titulo
    texto: O que e Filosofia?
- fala: Na filosofia e na linguagem, a gente chama isso de enunciado em que se pede ao interlocutor
    uma informacao. Toda vez que voce quer saber algo, voce faz uma pergunta.
  quadro:
    tipo: texto
    texto: 'Pergunta: enunciado que pede informacao ao interlocutor'
- fala: Mas as perguntas nao aparecem so com aquela carinha de duvida tradicional. Na pragmatica,
    que e o estudo de como usamos a lingua na pratica, elas podem aparecer de varias formas.
  quadro:
    tipo: titulo
    texto: Tipos de Atos de Fala
- fala: Elas sao enquadradas como um tipo de ato de fala diretamente realizado por oracoes
    interrogativas. E aquela frase classica que termina com ponto de interrogacao.
  quadro:
    tipo: texto
    texto: '1. Direto: Orações Interrogativas'
- fala: Mas voce tambem pode fazer uma pergunta de forma indireta. Sabia disso? Usando oracoes
    imperativas, que sao aquelas que dao ordens ou pedidos.
  quadro:
    tipo: texto
    texto: '2. Indireto: Orações Imperativas'
- fala: Ou entao atraves de oracoes declarativas, que apenas afirmam algo, mas funcionam como
    um pedido de informacao naquele contexto.
  quadro:
    tipo: texto
    texto: '3. Indireto: Orações Declarativas'
- fala: Para organizar tudo isso, os estudiosos dividem as perguntas em diversos tipos e subtipos
    diferentes. Nao existe apenas um jeito de questionar.
  quadro:
    tipo: topicos
    texto: Classificacao das Perguntas
    itens:
    - Divididas em diversos tipos
    - Possuem subtipos variados
    - Usadas na pragmatica do dia a dia
- fala: 'Agora me responda: se voce usa uma frase no imperativo para pedir algo a alguem,
    como isso se encaixa na definicao de fazer uma pergunta?'
  quadro:
    tipo: texto
    texto: 'Pergunta de Fechamento: Como ordens podem ser perguntas?'
