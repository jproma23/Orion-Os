    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/protocolo.h
    corpo: >-
      Protocolo de mensagens (Cap 5 secao 5) do lado do firmware..
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/radar_manager.h
    corpo: >-
      Radar Manager (Cap 10 secao 6) - radar frontal (SCAN_FRONT).. Classes:
      RadarManager. Funcoes: iniciar, atualizar, boa, iniciarVarredura, man
