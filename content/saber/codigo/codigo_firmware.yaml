    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/motor_manager.h
    corpo: >-
      Motor Manager - controle dos 2 motores DC JGB37-520 (encoder +
      reducao) via L298N, com PID de velocidade; substituiu os steppers TB6600
      em 2026-09-13. Classes: MotorManager, TipoMovimento. Funcoes: iniciar, habilitar,
      desabilitar, loop, andarFrente, andarDistancia, girarContinuo, girarGr
      aus.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/pins.h
    corpo: >-
      Niveis do modulo de rele da lanterna, nomeados para o codigo dizer o q
