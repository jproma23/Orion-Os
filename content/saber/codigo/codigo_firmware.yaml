    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/safety_manager.h
    corpo: >-
      Safety Manager (Cap 10 secao 9) - seguranca reativa.. Classes: SafetyM
