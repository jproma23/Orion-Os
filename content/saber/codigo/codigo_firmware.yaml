    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/sensor_ultrassonico.h
    corpo: >-
      ARQUIVO REMOVIDO: era o driver dos ultrassons HC-SR04, que sairam do
