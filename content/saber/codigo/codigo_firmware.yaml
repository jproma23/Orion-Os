# Saber do ORION - area: CODIGO (firmware)
# Cada arquivo do firmware descrito para o robo se entender por dentro.
conhecimentos:
  - tipo: conceito
    titulo: firmware/hardware_core/src/encoder_manager.cpp
    corpo: >-
      Fila circular entre a ISR e o loop(), uma por roda.. Funcoes: _tratarB
      orda, _isrEsquerdo, _isrDireito, iniciar, _consumir, perdeu, atualizar
      , zerar.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/src/framing.cpp
    corpo: >-
      Funcoes: crc16, enviarQuadro, alimentar, finalizarQuadro.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/src/main.cpp
    corpo: >-
      Hardware Core - firmware completo (Cap 10).. Funcoes: escanearI2c, env
      iarPayloadVazio, notificarTransicaoDeEstado, notificarFimDeVarredura,
      responderWhoAreYou, responderReturnStatus, Raspb
      erry.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/src/protocolo.cpp
    corpo: >-
      Funcoes: gerarIdMensagem, enviarMensagem.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/bateria_manager.h
    corpo: >-
      Bateria Manager (Cap 16) - tensao do pack por divisor resistivo em A0.
      . Classes: BateriaManager, NivelBateria. Funcoes: iniciar, atualizar,
      tensaoV, lida, percentualEstimado, nivel, nomeNivel.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/bussola_manager.h
    corpo: >-
      Bussola Manager (Cap 10 secao 7) - HMC5883L via I2C (GPIO 21/22 no ESP
      32),. Classes: BussolaManager. Funcoes: begin, loop, conec
      tado, calibrando, calibrada, rumoValido, rumoGraus.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/command_executor.h
    corpo: >-
      Command Executor (Cap 10 secao 10) - traduz COMMAND em acao nos manage
      rs.. Classes: CommandExecutor. Funcoes: CommandExecutor, setup, comand
      o, reativa, detectado, sozinho.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/dht_manager.h
    corpo: >-
      DHT Manager (Cap 10 secao 8) - temperatura/umidade (pino 24, CONFIRMAD
      O).. Classes: DhtManager. Funcoes: iniciar, atualizarSeParado, tempera
      turaC, umidadePercent, leituraValida, ausente.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/encoder_manager.h
    corpo: >-
      Quantas chapas ha em cada roda. Se o dono mudar a montagem, e AQUI.. C
      lasses: EncoderManager. Funcoes: esquerdo, direito.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/estado.h
    corpo: >-
      Maquina de estados do Hardware Core (Cap 10 secao 4).. Classes: Estado
      , MaquinaDeEstados. Funcoes: nomeEstado, atual, mudou, anterior.
    fonte: codigo-fonte do ORION (firmware)
    confianca: 0.9
  - tipo: conceito
    titulo: firmware/hardware_core/include/framing.h
    corpo: >-
      Camada de enquadramento (Cap 14 secao 3): STX/ETX + byte-stuffing + CR
