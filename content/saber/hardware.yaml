# Saber do ORION - area: HARDWARE
# Sensores e atuadores do proprio corpo.
conhecimentos:
  - tipo: conceito
    titulo: Rodas e encoders
    corpo: >-
      Tenho duas rodas motrizes de 60 mm, cada uma com um motor DC JGB37 de
      6 V, reducao 1:168 e encoder de quadratura proprio: sao DOIS encoders,
      um por roda, 3696 pulsos por volta, uns 19600 pulsos por metro. Um
      L298N liga os motores e um PID a 50 Hz iguala as duas rodas. A bitola
      efetiva e 27 cm. Andar reto usa a bussola junto com os encoders.
    fonte: journal 2026-10-31, orion.yaml (chassi) e motor_manager.h
    confianca: 0.9
  - tipo: conceito
    titulo: LiDAR STL-50B2
    corpo: >-
      Meu LiDAR gira 360 graus no alto, a 45 cm do chao e 8 cm atras da
      ponta da frente, ligado por USB ao Raspberry a 230400 baud. Mede a
      distancia em todas as direcoes varias vezes por segundo. A trava de
      seguranca para as rodas a 50 cm de um obstaculo. Nao ve o que fica
      abaixo de 45 cm.
    fonte: orion.yaml (chassi, trava_lidar) e journal 2026-10-31
    confianca: 0.9
  - tipo: conceito
    titulo: BME280
    corpo: >-
      Sensor de temperatura, pressao e umidade, com comunicacao I2C. Usado
      para medir o ambiente.
    fonte: tests/unit/test_saber_memoria.py e orion.yaml
    confianca: 0.9
  - tipo: conceito
    titulo: GY-271
    corpo: >-
      Bussola magnetica (HMC5883L ou clone QMC5883L, autodetectado) via I2C:
      mede o rumo em graus, corrigido pela calibracao gravada na EEPROM.
      Substituiu a QMC6310 em 2026-08-15. E a minha bussola: esta LIGADA e foi
      CALIBRADA em 2026-10-31; com ela eu sei para onde estou apontando e
      ando reto junto com os encoders.
    fonte: orion.yaml (fusao_sensores) e commit 637ab18
    confianca: 0.9
  - tipo: conceito
    titulo: ESP32
    corpo: >-
      Microcontrolador do audio: capta os microfones e o wake word "Jarvis" e
      transmite por socket TCP (16 kHz) para o Notebook. O transporte e
      correto; o ruido de captacao (SNR do mic) e o portao aberto do hardware.
    fonte: orion.yaml (voice) e ROADMAP portao 1
    confianca: 0.9
  - tipo: conceito
    titulo: Servos pan e tilt
    corpo: >-
      Os servos da cabeca do robo: pan de -80 a 80 graus e tilt de -30 a 45,
      ate 60 graus por segundo. A cabeca volta ao centro sozinha apos 3
      minutos de ociosidade; em modo manual, o dono controla.
    fonte: orion.yaml (vision) e journal 2026-08-04
    confianca: 0.9
  - tipo: conceito
    titulo: TCRT5000
    corpo: >-
      Sensor de reflexao que foi planejado como encoder em agosto e NAO e
      usado. Os encoders de verdade sao os dos proprios motores das rodas
      (JGB37, quadratura), um em cada roda, contando 3696 pulsos por volta.
    fonte: journal 2026-10-31 e firmware/hardware_core/include/pins.h
    confianca: 0.9
  - tipo: conceito
    titulo: Modo sentinela
    corpo: >-
      Vigilia do robo: ao receber um alerta (barulho estranho ou rosto
      desconhecido), o maestro assume o controle por 8 segundos, orienta-se
      para a origem, pede foto e notifica antes de liberar.
    fonte: orion.yaml (behavior.vigilia)
    confianca: 0.9
