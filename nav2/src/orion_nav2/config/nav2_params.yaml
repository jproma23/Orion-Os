# Parametros do Nav2 para o ORION (base: nav2_bringup/params/nav2_params.yaml,
# reduzido e adaptado). Rodar com navigation_launch.py + slam_toolbox.
# NOTA: o parser do ROS 2 so aceita blocos `<nome>: ros__parameters:` no topo -
# chave solta na raiz quebra a leitura.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 500
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    transform_tolerance: 0.5

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    FollowPath:
      # DWB sumiu desta build do Humble (a classe nav2_dwb_controller nao
      # existe; a lista real e dwb_core/MPPI/RegulatedPurePursuit). O
      # RegulatedPurePursuit e a escolha simples para um robo diferencial
      # de baixa velocidade - menos parametros, menos pontos de falha.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.09
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.5
      use_rotate_to_heading: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # FOOTPRINT = o RETANGULO real do corpo, no referencial do base_link
      # (2026-11-10, C2-05; decisao do dono). base_link = meio do eixo das
      # rodas motrizes, que sao as da FRENTE; x para a frente, y para a
      # esquerda. Traseira -0,32 (LiDAR 10 cm atras do eixo + 22 cm do LiDAR a
      # traseira), frente +0,03 (a roda de 60 mm passa 3 cm do eixo; a ponta
      # do corpo fica atras dela), y +-0,195 (largura 0,39). Era um circulo
      # robot_radius 0,20/0,25 centrado no eixo: cobria 25 cm para tras de um
      # corpo que tem 32. tests/unit/test_nav2_footprint.py prende estes
      # numeros ao chassi do orion.yaml.
      footprint: "[[0.03, 0.195], [0.03, -0.195], [-0.32, -0.195], [-0.32, 0.195]]"
      footprint_padding: 0.01
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          # Raio SEM ECO chega como inf (bridge_scan_odom). Sem isto o layer
          # descarta o inf e nunca LIMPA o espaco livre naquela direcao: um
          # obstaculo que saiu da frente ficava marcado para sempre
          # (2026-11-10). Com true o inf vira "livre ate o raytrace_max_range".
          inf_is_valid: true
      # (2026-11-10, C2-09) Aqui havia uma COPIA de observation_sources/scan
      # solta no nivel do costmap: nenhum plugin a lia - quem le e o
      # voxel_layer acima. Apagada para nao parecer configuracao viva.
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.5
      # FOOTPRINT = o RETANGULO real do corpo, no referencial do base_link
      # (2026-11-10, C2-05; decisao do dono). base_link = meio do eixo das
      # rodas motrizes, que sao as da FRENTE; x para a frente, y para a
      # esquerda. Traseira -0,32 (LiDAR 10 cm atras do eixo + 22 cm do LiDAR a
      # traseira), frente +0,03 (a roda de 60 mm passa 3 cm do eixo; a ponta
      # do corpo fica atras dela), y +-0,195 (largura 0,39). Era um circulo
      # robot_radius 0,20/0,25 centrado no eixo: cobria 25 cm para tras de um
      # corpo que tem 32. tests/unit/test_nav2_footprint.py prende estes
      # numeros ao chassi do orion.yaml.
      footprint: "[[0.03, 0.195], [0.03, -0.195], [-0.32, -0.195], [-0.32, 0.195]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    # `map_frame`/`odom_frame` sao os nomes que o slam_toolbox LE (2026-11-10,
    # C2-09); `*_frame_name` era ignorado e so funcionava porque o padrao
    # coincide com map/odom.
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    map_update_interval: 5.0
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0