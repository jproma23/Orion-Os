services:
  nav2:
    build: .
    image: orion-nav2
    # host: a ponte fala com o Motion Core em 127.0.0.1:8080 (acesso local,
    # sem senha) e o ROS 2 roda com discovery da rede do host - sem mapear
    # portas nem brigar com o Discovery Server.
    network_mode: host
    # "no" e NAO "unless-stopped" (2026-09-20): quem manda subir e parar o
    # Nav2 agora e o GerenteNav2, no Motion Core, conforme o robo precise
    # navegar - ele custa 225 MB medidos num Pi de 3,8 GB.
    #
    # Com `unless-stopped` o Docker ressuscitava o container no boot e logo
    # depois de todo `docker stop` do gerente, desfazendo a economia sem dizer
    # nada. As duas pontas tem que concordar: se voltar para o modo antigo
    # (`nav2.sob_demanda: false` no orion.yaml), volte isto para
    # `unless-stopped` tambem, senao ninguem sobe o Nav2.
    restart: "no"
    # O codigo das pontes MONTADO e nao so copiado na imagem (2026-10-31):
    # mudar uma ponte nao exige rebuild de uma imagem de 2,3 GB no Pi.
    volumes:
      - ./src:/opt/orion_nav2/src:ro
    environment:
      - ROS_DOMAIN_ID=0
