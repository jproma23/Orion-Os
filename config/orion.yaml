# ORION OS — Configuração única (Capítulo 17)
# Nenhum valor deve ser fixado no código. Todo parâmetro vive aqui.

system:
  robot_name: "Jarvis"
  language: "pt-BR"
  timezone: "America/Sao_Paulo"
  log_level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  profile: "HOME"            # HOME | SILENT | DEMO | SAFE | DEV

communication:
  raspberry:                  # enlace Notebook <-> Raspberry (Motion Core)
    transport: "tcp"          # TCP ponto a ponto - Ethernet na producao final
                               # (EDR-0018), mas hoje os dois falam por WiFi
                               # (decisao do usuario, 2026-07-17: ja validado
                               # funcionando, ver docs/journal.md) - o "host"
                               # abaixo e o IP da Raspberry NESSA rede WiFi de
                               # desenvolvimento, nao a subrede Ethernet fixa
                               # de producao (192.168.50.x) que ainda nao
                               # existe fisicamente.
    # 127.0.0.1 desde 2026-09-16, quando o Mission Core passou a rodar NO
    # PROPRIO PI, do lado do Motion Core. A aposentadoria do Notebook daquele
    # dia foi desfeita em 30/09 (EDR-0036), mas o Mission Core continua no Pi
    # nessa divisao - o Notebook volta so com visao e voz - entao o loopback
    # segue certo. Este campo ainda
    # guardava o IP da Raspberry numa rede WiFi que nao existe mais, entao o
    # Mission Core subia e nunca achava rota ("Sem rota conhecida para o
    # destino motion_core") - e o chat respondia "o Fofao nao respondeu a
    # tempo". Como os dois processos agora sao a MESMA maquina, o loopback
    # tambem encerra de vez a classe de problema que trocar de rede (DHCP)
    # causava neste enlace.
    host: "127.0.0.1"
    tcp_port: 5757
    maintenance_usb: "auto"   # USB direto apenas para manutencao/diagnostico
  notebook:                   # acesso ADMINISTRATIVO do Pi ao Notebook (SSH)
    # NAO e o enlace de dados - esse e o TCP acima, e ele nao serve aqui: o
    # Notebook precisa RECEBER uma ordem de desligar mesmo quando o Mission
    # Core ja caiu, e e o Pi a unica maquina que o alcanca por SSH.
    # NOME e nao IP, de proposito: o IP muda por DHCP e ja quebrou os ouvidos
    # uma vez (ver hearing.host mais abaixo). O mDNS resolve Joao.local.
    host: "Joao.local"
    usuario: "jproma23"
  hardware_core:              # enlace Raspberry <-> ESP32 (Hardware Core)
    # Caminho FIXO por by-id, nao "auto" (2026-08-03). O Mega morreu e o corpo
    # virou ESP32, mas o cadaver do Mega continuou plugado no Pi - e "auto"
    # varre /dev/ttyUSB0 primeiro (ver PORTAS_SERIAIS_CANDIDATAS em
    # motion_core/__main__.py). Resultado: o Motion Core adotava a placa morta
    # e passava horas empilhando "ACK nao recebido" + "Heartbeat perdido". O
    # sintoma parecia software quebrado; a causa era qual cabo estava em qual
    # porta. O by-id e montado pelo udev a partir dos descritores USB, entao
    # aponta para a PLACA e nao para a ordem de enumeracao: com dois
    # conversores ligados ao mesmo tempo, so o certo casa. Mesma licao que a
    # camera ja tinha aprendido (ver camera_url mais abaixo).
    # Se a porta nao existir, _conectar_hardware_core apenas devolve False e loga -
    # nao levanta excecao (Cap 6 s.8), entao o robo sobe sem corpo em vez de
    # nao subir.
    # Voltar para "auto" so faz sentido quando houver UMA unica serial no Pi.
    #
    # O CAMINHO DE SAIDA DO USB JA ESTA PRONTO, MAS AINDA NAO E ESTE (2026-09-20).
    #
    # O Pi tem 4 portas e 5 candidatos: SSD, LiDAR, tela ESP32-S3, corpo e a
    # placa de audio USB. (Desde 25/10 a tela saiu do robo e a voz mora no
    # Notebook - EDR-0036 -, entao a porta dela ficou livre.)
    #
    # A UART do header GPIO ja foi HABILITADA no Pi (enable_uart=1 +
    # dtoverlay=disable-bt no config.txt, console serial removido do
    # cmdline.txt, em 2026-09-20) e devolve essa porta quando os fios forem
    # passados. Fica valendo o USB ate la - nao se aponta a config para um
    # cabo que ainda nao existe.
    #
    # ESTADO EM 2026-09-20: a UART do header JA ESTA ATIVA no Pi
    # (`/dev/ttyAMA0` existe, PL011, console serial removido do cmdline).
    # Falta so passar os tres fios acima. Enquanto isso o corpo continua
    # pelo USB, que funciona identico - o ESP32 usa a MESMA UART0 nos dois
    # caminhos.
    #
    # PARA MIGRAR: passe os fios e troque esta linha por "/dev/ttyAMA0".
    # Nao precisa reiniciar o Pi de novo - o overlay ja pegou.
    #
    #     Pi pino  8 (GPIO14, TX) --> ESP32 RX (GPIO3)
    #     Pi pino 10 (GPIO15, RX) <-- ESP32 TX (GPIO1)
    #     Pi pino  6 (GND)        --- ESP32 GND
    #
    # 3,3 V nos dois lados: liga direto, sem conversor de nivel.
    #
    # Sera ttyAMA0 e NAO ttyS0/serial0: com `dtoverlay=disable-bt` o header
    # recebe a PL011, que tem clock proprio. A mini-UART (ttyS0) segue a
    # frequencia do core e corrompe quadros a 250000 baud quando o governor
    # muda o clock - nao e teoria nesta velocidade.
    #
    # AO GRAVAR O FIRMWARE DEPOIS DE MIGRAR: o ESP32 usa a MESMA UART0
    # (GPIO 1/3) para o USB e para esses fios. Desligue os fios do header
    # antes de gravar pela USB, ou os dois transmissores brigam no mesmo par.
    port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
    # 250000 desde 2026-07-27 (era 115200). O pacote de telemetria passa de
    # 600 bytes e o buffer serial do Mega e de 64 - o firmware BLOQUEAVA ate
    # 84ms por pacote esperando drenar, e nesse tempo ele nao le o eco do
    # ultrassom (que dura 1,7ms a 30cm). Ver o comentario em
    # firmware/hardware_core/src/main.cpp::setup.
    # TEM que ser igual ao Serial.begin() do firmware - se so um lado mudar,
    # o Mega fica mudo e a descoberta por WHO_ARE_YOU falha em todas as portas.
    baud_rate: 250000
    # COMO SE FALA COM O CORPO. "serial" e o caminho historico e VOLTOU a
    # ser o escolhido (decisao do dono, 2026-09-20 a noite), depois de uma
    # passagem curta por "websocket".
    #
    # POR QUE FOI PARA O WEBSOCKET: acabaram as portas USB do Pi e o ESP32
    # tinha sido regravado com um firmware WiFi sem fonte. Funcionou, esta
    # tudo commitado (firmware/corpo_ws + ponte_corpo_ws.py) e continua
    # servindo se um dia o corpo ficar longe do Pi.
    #
    # POR QUE VOLTOU: a UART do header GPIO resolve a falta de porta USB sem
    # gastar nenhuma, e tira o WiFi do laco de controle - que o EDR-0031
    # desaconselha com razao. E no caminho o WiFi mostrou os dois jeitos de
    # sumir, os dois no mesmo dia: o DHCP trocou o IP (.112 -> .102) e o
    # mDNS parou de anunciar sem o ESP32 nem reiniciar.
    #
    # A serial ainda traz MAIS dado: a telemetria binaria inclui bussola
    # (rumo, campo, calibracao), varredura de I2C e tempos de loop - nada
    # disso existia no JSON do WebSocket.
    transporte: "serial"
    # NOME, e nao IP - e o risco que estava anotado aqui se materializou na
    # primeira regravacao (2026-09-20): o DHCP trocou o endereco de .112
    # para .102 e o corpo sumiu ate alguem editar esta linha a mao.
    #
    # O firmware agora se anuncia por mDNS como `orion-corpo.local`
    # (ESPmDNS, em firmware/corpo_ws/include/wifi_corpo.h) e o Pi resolve
    # .local pelo avahi, que ja estava ativo. O endereco pode mudar a
    # vontade que o nome continua valendo.
    #
    # Se um dia o mDNS falhar, um IP ainda funciona aqui - mas conferir
    # antes com `getent hosts orion-corpo.local`.
    # DOIS enderecos, tentados em ordem - e nao um so. Os dois jeitos de o
    # corpo sumir aconteceram no mesmo dia (2026-09-20) e sao independentes:
    #
    #   o IP muda      - o DHCP trocou .112 por .102 numa regravacao;
    #   o NOME some    - o ESP32 parou de anunciar o mDNS sem nem reiniciar
    #                    (o avahi deixou de ver o servico e `getent hosts`
    #                    passou a falhar), com o WebSocket VIVO no IP.
    #
    # Nome primeiro porque ele sobrevive a troca de IP, que e o caso mais
    # comum; o IP atras como rede de seguranca. O que responder vai para a
    # frente da fila, entao depois de uma falha de mDNS nao se paga o
    # timeout de DNS a cada reconexao.
    #
    # Se trocar o roteador e o IP mudar, o nome cobre. Se o mDNS falhar,
    # conferir o endereco novo no log de boot do ESP32 e atualizar aqui.
    websocket_url:
      - "ws://orion-corpo.local:81"
      - "ws://10.20.20.102:81"
    # QUANTO VALE UM "passo" DA TELEMETRIA - TODOS OS TRES SAO SUPOSICAO.
    #
    # O firmware nao anda distancia (so velocidade continua), entao quem
    # conta pulsos e freia e o Pi. Esta conta e a que transforma "ande 50 cm"
    # em "pare depois de N pulsos" - e ela esta empilhada sobre tres numeros
    # que ninguem mediu:
    #
    #   1. a reducao da caixa (1:90 e decisao provisoria - peca a caminho)
    #   2. a bitola do robo (0,45 m nunca foi medida com fita)
    #   3. se o "passo" deste firmware e pulso de encoder ou passo de stepper
    #      - o firmware e da linhagem ANTIGA, dos TB6600, e o nome sugere
    #      stepper. Com os motores desmontados nao da para saber.
    #
    # Os valores abaixo saem de firmware/hardware_core/include/motor_manager.h
    # (11 PPR x 2 bordas x 90 de reducao = 1980 pulsos por volta da roda).
    # MEDIR na bancada, com as rodas no ar, antes de confiar em centimetro.
    pulsos_por_metro: 3151.0    # 1980 / (pi * 0,200 m)
    pulsos_por_grau: 12.4       # 1980 * 0,45 / (360 * 0,200)
  ack_timeout_ms: 500
  max_retries: 3
  heartbeat_interval_s: 1.0
  heartbeats_lost_threshold: 3   # padrao: link morto apos 3s sem heartbeat
  # Tolerancia POR ENLACE (sobrescreve o padrao acima). Nem todo link
  # merece a mesma paciencia:
  #
  #   hardware_core (Arduino) - fica no PADRAO curto de proposito: e o
  #     caminho da seguranca reativa, detectar falha rapido importa.
  #
  #   mission_core (Notebook) - tolerante. Inferencia de IA local satura a
  #     CPU da maquina por dezenas de segundos e atrasa os heartbeats sem
  #     que nada esteja quebrado. Com 3s o Pi declarava o link morto a cada
  #     consulta a IA e reconectava em laco (medido 2026-07-19). O link
  #     com o Notebook NAO esta no caminho da seguranca - perder alguns
  #     segundos para detectar sua queda e aceitavel; derrubar o link a
  #     cada pico de CPU nao e.
  #   motion_core (visto DO Notebook) - tambem tolerante, e o motivo e
  #     menos obvio: a maquina afogada nao so ATRASA os proprios heartbeats,
  #     ela tambem deixa de LER os que chegam. Sem isto o Notebook conclui
  #     que o Pi morreu enquanto o culpado e ele mesmo (medido 2026-07-19:
  #     o Pi parou de derrubar o link, mas o Notebook continuava
  #     derrubando o dele). Tolerancia tem que valer nos DOIS lados.
  heartbeats_lost_threshold_por_link:
    mission_core: 45
    motion_core: 45

# Medidas físicas do Fofão (2026-07-29, medidas com fita pelo mantenedor).
#
# POR QUE O ROBÔ PRECISA SABER O PRÓPRIO TAMANHO: distância sozinha não diz
# se cabe. Uma varredura que acusa "80 cm livres a 130°" só vira "posso
# passar por ali" depois de comparar com a largura - sem isto o robô escolhe
# uma passagem estreita demais com toda a confiança do mundo.
#
# E girar no lugar não usa a largura, usa a DIAGONAL: um corpo de 50x30 cm
# varre um círculo de ~58,3 cm ao rodar sobre o próprio centro. Decidir
# "posso girar aqui" olhando só os 50 cm raspa o canto.
chassi:
  # MEDIDAS DO DONO, 2026-10-31 (fita metrica, nao suposicao):
  largura_m: 0.39          # ponto mais largo
  profundidade_m: 0.30
  altura_m: 0.45           # define por baixo do que ele passa
  roda_diametro_m: 0.060   # roda motriz de 60 mm: anda 0,1885 m por volta
  roda_apoio_distancia_m: 0.25  # do eixo das rodas motrizes a roda de apoio
  # MEDIDAS DO LIDAR (2026-10-31): em cima, a 45 cm do chao (cego para tudo
  # mais baixo), ~8 cm atras da ponta da frente - com a trava parada, o LiDAR
  # mediu 48 cm e a fita deu ~40 da ponta ate a parede. USADO desde 08/11
  # pela trava (filtro da carcaca) e pelo footprint do Nav2.
  # A PONTA DO CORPO (LiDAR + 8 cm) fica 2 cm ATRAS do eixo motriz; quem vai
  # mais longe na frente e a RODA (eixo + raio = +3 cm). Nao e contradicao:
  # por isso o footprint do Nav2 termina em +0,03 (dono, 11/11: valem estas
  # medidas, as anteriores estao erradas).
  lidar_altura_m: 0.45
  lidar_recuo_m: 0.08
  lidar_ate_eixo_motriz_m: 0.10  # eixo dianteiro ate o centro do LiDAR (LiDAR 10 cm atras do eixo)
  raio_seguranca_m: 0.25         # raio de seguranca unico do robo (25 cm do centro do LiDAR, decisao do dono 10/11)
  # TEM que bater com RODA_DIAMETRO_M em firmware/.../motor_manager.h
  # (tests/unit/test_medidas_corpo.py prende os dois).
  # PENDENTE - medir e preencher:
  #   bitola_m: distância centro a centro das duas rodas. Entra na odometria
  #     diferencial (fusao_sensores.py) e no cálculo de graus por passo.
  #     Hoje o valor usado é o placeholder `motion.wheel_base_m` abaixo.
  #   lidar_altura_m: a que altura do chão o LiDAR está. Ele varre um PLANO;
  #     abaixo (e acima) dessa linha é cego - degrau, pé de cadeira, brinquedo
  #     no chão, tampo de mesa na altura da cabeça. Era
  #     `ultrassom_frontal_altura_m` até 2026-09-19; os ultrassons saíram do
  #     robô, a pendência não saiu junto, porque o problema nunca foi do
  #     ultrassom - é de qualquer sensor montado numa altura só.

motion:
  # 30 e nao 60 (EDR-0037, 01/11): bateu duas vezes no mesmo dia. Sobe so
  # depois do teste de frenagem medido com trena.
  max_speed_percent: 30
  # TRAVA DO LIDAR (EDR-0037): porteiro de todo comando de roda + STOP no meio
  # do movimento + watchdog. Numeros do dono, 01/11.
  trava_lidar:
    bloquear: true
    distancia_cm: 50        # frente e tras, modo autonomo
    piso_manual_cm: 25      # modo manual: obedece ate o raio de seguranca (25 cm do LiDAR; a re volta a travar)
    meia_largura_cm: 25     # corredor: 39 cm de corpo / 2 + folga
    raio_giro_cm: 37.5      # varredura do canto traseiro em volta do eixo dianteiro (dono, 10/11)
    idade_max_s: 0.6        # LiDAR publica a cada 0,2 s: 3 varreduras perdidas = STOP
  acceleration_percent: 40
  # PULSOS DE ENCODER POR METRO desde 2026-10-31 (o nome ficou de quando eram
  # passos de motor de passo). Derivado, nao digitado:
  #   11 pulsos/volta do motor x 2 bordas x 168 de reducao = 3696 por volta
  #   3696 / (PI * 0,060 m de roda) = 19608
  # A reducao 1:168 foi MEDIDA contando voltas da roda (2026-10-31: 35360
  # pulsos = 9,5 voltas). TEM que bater com PULSOS_POR_METRO em
  # firmware/.../motor_manager.h (tests/unit/test_medidas_corpo.py prende).
  # O ajuste fino (~2%) vem do teste no chao, em odometry_correction_factor.
  steps_per_meter: 19608

  # O encoder VOLTOU (motor DC com encoder, 2026-09-13) e conta os pulsos que
  # vao em passos_esquerda/passos_direita - a pose e MEDIDA da roda.
  odometry_correction_factor: 1.0  # calculado na autocalibracao (Cap 12 s.9)
  autocalibrate_on_first_boot: true
  min_front_distance_cm: 25      # parada reativa (Camada 1)
  min_rear_distance_cm: 20
  mission_timeout_s: 30
  wheel_base_m: 0.27             # bitola EFETIVA, medida girando com a bussola
  # calibrada (2026-10-31): a fita deu 0,36, mas o robo girava 1,35x o pedido.
  # Entra na odometria diferencial (fusao_sensores.py) e TEM que bater com
  # BITOLA_M do firmware (test_medidas_corpo.py).

navigation:
  follow_distance_m: 1.2
  follow_lost_timeout_s: 10
  patrol_scan_before_segment: true
  obstacle_retry_max: 3
  obstacle_recorrente_janela_s: 300
  obstacle_recorrente_limite: 2
  reduced_speed_near_person_percent: 30

  # LiDAR LD06 (Motion Core, USB serial) na checagem tatica de obstaculo.
  # `lidar_frontal_angulos_graus` e a janela em torno da FRENTE do robo
  # (convencao do mapa da web: 0° = esquerda, 90° = frente, 180° = direita):
  # [-60, 60] cobre os 120° a frente. `lidar_min_obstaculo_cm` e a menor
  # distancia em algum setor frontal que bloqueia o avanco.
  lidar_frontal_angulos_graus: [-60, 60]
  lidar_min_obstaculo_cm: 25

# O Nav2 (container Docker) LIGADO SO QUANDO PRECISA (2026-09-20).
#
# Pedido do dono: "o que consome muita ram so usar no momento certo". Medido
# no Pi parando e subindo o container de verdade:
#
#     nav2 no ar    1686 MB livres      subir ate o bridge responder: 15 s
#     nav2 parado   1911 MB livres      parar (SIGTERM ate sair limpo): 11 s
#     -------------------------------
#     custo          225 MB  (5,9% da RAM do Pi, que so tem 3,8 GB)
#
# Nao custa o mapa: o slam_toolbox roda em "mode: mapping" SEM "map_file_name"
# (nav2/config/nav2_params.yaml), entao ele ja nunca salvou nada - o mapa
# morria a cada reinicio do container e a cada boot, com ou sem isto.
#
# O PRECO sao os 15 s do primeiro goal depois de um periodo parado. Quem for
# falar nesse intervalo tem o evento "navigation.nav2_subindo" para saber.
nav2:
  sob_demanda: true
  # 10 min: maior que a pausa entre duas pernas de uma mesma ronda (senao ele
  # pagaria os 15 s de novo no meio dela), e curto o bastante para a RAM
  # voltar quando o robo de fato parou.
  ocioso_para_desligar_min: 10

# LiDAR STL-50B2 (familia 3iRobotix Delta-2) - o unico dos tres que foi
# TESTADO COM O HARDWARE NA MAO (bancada 2026-09-15: varredura 360° coerente,
# duas voltas seguidas batendo dentro de poucos milimetros em 36 setores).
# Leitor dToF de 360° ligado no Raspberry via USB CH340, baud fixo 230400.
#
# NAO tem comando de start: ao energizar, o motor gira e os dados fluem
# sozinhos (o anuncio dizia o contrario; foi medido). Quadro de 85 bytes com
# cabecalho AA 55 - nada a ver com o LD06 (54 2C) nem com o COIN-D6
# (55 AA 83 08, esse sim precisa de start).
#
# Historico: o COIN-D6 (decisao de 2026-08-20) substituiria o LD06, que veio
# com defeito, mas o motor dele nunca girou com a corrente do CH340. Os dois
# parsers continuam no repo e valem pela config `driver` abaixo.
#
# O Motion Core le a serial e publica `lidar.scan` com setores para a
# navegacao, a web e o bridge ROS2 (Nav2). O ESP32 nao le o LiDAR.
lidar:
  habilitado: true
  driver: "stl50b2"            # ld06 | coin_d6 | stl50b2
  # "auto" procura /dev/ttyUSB* e /dev/ttyACM*. O alias /dev/lidar vem da
  # regra udev 99-orion-lidar.rules (reescrita em 16/09 - a anterior estava
  # com a sintaxe corrompida e nunca criou symlink nenhum).
  # CUIDADO: o CH340 e generico e os ouvidos ESP32 usam o mesmo VID/PID. Com
  # os dois plugados, /dev/lidar pode apontar para o ESP32 errado; nesse caso
  # fixe aqui a porta real (ex.: /dev/ttyUSB1) ou amarre a regra udev a porta
  # fisica do hub.
  port: "/dev/lidar"
  baud_rate: 230400           # MEDIDO: em 115200 nao sai um byte sequer
  setores: 12                 # numero de leques de 360/setores graus
  # EM QUE ANGULO DO LIDAR FICA A FRENTE DO ROBO (lado da camera). MEDIDO em
  # 2026-10-31 andando 19 cm para a frente e voltando, com os raios grau a
  # grau: a direcao que encurtou foi 346 graus na ida e 344 na volta. O codigo
  # supunha 90 sem nunca ter medido - a trava de colisao vigiava as COSTAS e
  # o robo quase tombou encostando numa parede. O gerenciador gira tudo para
  # que, publicado, 90 seja a frente (convencao do projeto: 0 esquerda, 90
  # frente, 180 direita - sentido conferido girando o robo).
  # 19 desde 2026-11-01 (noite), MEDIDO e CONFIRMADO PELO DONO ("esta
  # certinho"). Parede a 30 cm de frente: reta ajustada nos pontos dava a
  # perpendicular em 124 graus publicados = 19 bruto. Conferido com a parede
  # encostada a direita: ponto mais perto exatamente em 180 graus. O 345 de
  # 31/10 era a BORDA da faixa onde o sensor perde a parede perto e de frente
  # - o raio da frente nao tinha eco e o teste pegou o primeiro visivel.
  # (255 ficou valendo minutos, por engano de leitura do mapa.)
  angulo_frente_graus: 19
  # 100 e nao 50 (2026-10-31): com a escala certa apareceram leituras a 5-6 cm
  # do centro do LiDAR (39-42 graus, frente-esquerda) - dentro do proprio
  # robo (cabo/fio perto do sensor). No mapa do Nav2 isso vira "obstaculo
  # dentro do corpo" e ele recusa andar. Dentro de 10 cm do LiDAR so existe o
  # robo.
  # 50 desde 2026-11-01 (noite). Era 100 de manha, por leituras de 5-6 cm
  # "dentro do robo" - mas 30 s de captura bruta com filtro em 0 nao acharam
  # NENHUM ponto a menos de 12 cm em 360 graus: nao ha peca do robo na visao
  # do LiDAR. 100 descartaria parede encostada no para-choque.
  min_distancia_mm: 50
  max_distancia_mm: 12000     # limite do sensor (12 m)
  # Intensidade do retorno. O COIN-D6 usa 0..63; o STL-50B2 usa 0..255. Com 0
  # aceita tudo nos dois - nao subir sem medir, a escala e diferente.
  confianca_minima: 0
  # DECORATIVO com o driver stl50b2: nenhum codigo le este campo hoje, e o
  # `rpm` publicado em lidar.scan sai 0.0 porque o campo de velocidade do
  # quadro (bytes +8..9) nunca foi decifrado. Sinal de LiDAR vivo neste
  # modelo e a chegada de quadros validos, nao o rpm.
  rpm_maximo: 20
vision:
  resolution: [640, 480]
  # Quadros por segundo PEDIDOS ao laco de visao - vira o orcamento de tempo
  # por quadro em _dormir_o_resto_do_quadro (1/fps).
  #
  # ERA 15, e 15 nunca foi alcancavel: o custo real por quadro e ~363 ms
  # (medido em 2026-07-30, ja com o reconhecimento facial em ritmo proprio),
  # contra os 66,7 ms que 15 fps pedem. Orcamento sempre estourado significa
  # sobra sempre negativa, sleep(0), e um laco que nunca dorme - um nucleo
  # inteiro dos 4 em 99% de CPU, 24 h por dia, medido duas vezes.
  #
  # Pedir mais do que o hardware entrega nao acelera nada: so desliga o freio.
  # Antes desta mudanca o robo processava ~1,8 quadros/s a 99% de CPU; com
  # fps: 2 ele processa 2 quadros/s e DORME o que sobra.
  #
  # 2 e conservador de proposito: deixa ~137 ms de folga sobre os 363 ms
  # medidos, para o quadro que cai no reconhecimento facial (mais caro) nao
  # estourar o orcamento e reabrir o problema.
  fps: 2
  yolo_model: "yolov8n"
  # Lado do quadrado para onde o YOLO reescala o quadro antes de inferir.
  # NAO e a resolucao da camera (essa e `resolution`, acima): o quadro chega
  # em 640x480 e o modelo o reduz para imgsz x imgsz.
  #
  # Medido neste Notebook em 2026-07-27 (CPU, sem GPU - a placa e uma Intel
  # UHD integrada, o torch nao acha CUDA):
  #     imgsz=640 -> 258 ms/quadro  ( 3,9 FPS)
  #     imgsz=320 -> 102 ms/quadro  (10,0 FPS)
  # Usar os 4 nucleos em vez de 2 nao mudou nada (263 ms) - o gargalo e banda
  # de memoria, nao paralelismo.
  #
  # 320 escolhido em 2026-07-27: com 640 o `fps: 15` pedido abaixo era
  # inalcancavel (o teto real era 3,9). PRECO: alvo pequeno ou distante ocupa
  # menos pixels na entrada do modelo e pode deixar de ser detectado. Se o
  # Fofao parar de enxergar gente de longe, este e o primeiro numero a subir.
  yolo_imgsz: 320
  confidence_threshold: 0.55
  # So para a resposta "o que voce esta vendo" (2026-11-01). 0,55 serve
  # para mover a cabeca e gerar eventos, onde falso positivo custa caro;
  # para LISTAR objetos era rigoroso demais e calava copo, celular e
  # controle. Os eventos e a cabeca continuam no confidence_threshold.
  confianca_para_descrever: 0.35
  # A CABECA SEGUE ROSTO E PESSOA DE NOVO (2026-11-01 noite, dono: "religa o
  # seguir rosto e pessoa"). Tinha sido desligado de manha (ebcd59d, "muito
  # chefe"). A cabeca tem DOIS donos - esta visao e o AcompanharPessoa do Pi -
  # entao olhar o log por briga nos servos.
  cabeca_segue_pessoa: true
  # De quantos em quantos quadros rodar o RECONHECIMENTO FACIAL (2026-07-30).
  #
  # 1 = todo quadro (o comportamento anterior a esta chave).
  #
  # Medido neste Notebook, com foto real de rosto salva pelo proprio robo:
  #     YOLO (imgsz=320) .......... 125 ms
  #     cvtColor ..................   0,3 ms
  #     reconhecimento facial ..... 442-716 ms   <- 78% do custo do quadro
  #
  # O laco gastava 567-716 ms POR QUADRO, contra um orcamento de 66,7 ms
  # (`fps: 15`). Como a sobra e sempre negativa, o freio de
  # `_dormir_o_resto_do_quadro` cai em `sleep(0)` e nunca dorme: um nucleo
  # inteiro dos 4 ficava em 99,2% de CPU, 24h por dia (medido: 12h18 de CPU
  # em 12h23 de processo).
  #
  # POR QUE NAO BARATEAR O RECONHECIMENTO, que seria o obvio: foi tentado e
  # medido, e TODAS as versoes rapidas perdem o rosto. Na mesma foto real:
  #     upsample=0 .............. 5,6x mais rapido, 0 rosto (era 1)
  #     metade da resolucao ..... 5,0x mais rapido, 0 rosto
  #     metade + upsample=0 .... 24,8x mais rapido, 0 rosto
  # So a configuracao atual acha o rosto. Velocidade que perde rosto nao e
  # ganho, e regressao silenciosa.
  #
  # POR QUE NAO USAR O YOLO COMO PORTEIRO ("so procura rosto se vir pessoa"),
  # que tambem seria obvio: medido nas 34 fotos reais com rosto, em 15 delas
  # o face_recognition acha o rosto e o YOLO NAO acha pessoa - rosto em close,
  # sem corpo a mostra. A guarda faria o robo deixar de reconhecer gente em
  # 44% dos casos.
  #
  # O que sobra, e o que esta implementado: separar os RITMOS. O YOLO continua
  # em todo quadro, entao ver pessoa e obstaculo reage igual; so o NOME da
  # pessoa demora ate N quadros a mais para chegar. Entre os reconhecimentos,
  # o ultimo resultado e reaproveitado, e o YOLO e quem manda na presenca.
  #
  # 3 e conservador: a ~1,8 quadros/s reais, o nome chega em ate ~1,7 s.
  face_recognition_every_n_frames: 3
  # Quantos quadros SEGUIDOS com a pessoa antes de o rastreador confirmar um
  # alvo e a visao passar a mover a cabeca.
  #
  # Era 3, FIXO no codigo (`vision/modulo.py`), contra a regra 6 da
  # arquitetura - e por estar fora da config nunca apareceu em investigacao
  # nenhuma. Trazido para ca em 2026-07-29.
  #
  # POR QUE 1, e nao 3: `vision.person_detected` sai a cada UM quadro com
  # pessoa, e e nesse evento que o `AcompanharPessoa` (prio 45) TRANCA a
  # cabeca, preemptando a IA estrategica (40). Com 3 aqui, 1 quadro trancava
  # a cabeca e 3 eram precisos para mover - e com `yolo_imgsz: 320` a
  # deteccao pisca, entao a sequencia de 3 raramente fechava. Medido em
  # producao: 208 trancas de cabeca numa hora e ZERO eventos
  # `motion.pan_tilt` em 35 s. A cabeca ficava presa por quem nao a move.
  #
  # 1 alinha a tranca com o motor: quem trava em um quadro tambem move em um
  # quadro. O PRECO e o que os 3 quadros evitavam - um falso positivo do YOLO
  # move a cabeca uma vez. Trocado de proposito: cabeca que se move errado
  # uma vez se corrige no quadro seguinte; cabeca travada nao se corrige.
  #
  # Se voltar a haver falso positivo movendo a cabeca, o numero a subir e
  # `confidence_threshold`, nao este - subir este traz o impasse de volta.
  target_confirmation_frames: 1
  pan_limits_degrees: [-80, 80]
  tilt_limits_degrees: [-30, 45]
  servo_max_speed_deg_s: 60
  # A DV20 (webcam USB dedicada a visao, no pan/tilt) so alcanca fisicamente
  # o Raspberry Pi (2026-07-28) - o Notebook, que roda o Vision Core, nao
  # tem como usar um indice de camera local pra ela. Por isso o Pi reexpoe
  # a DV20 na rede: servico `orion-camera-stream.service` (ffmpeg lendo o
  # MJPEG nativo da camera, sem recodificar) escutando em 8091. O
  # `cv2.VideoCapture` aceita URL exatamente como aceitaria um indice local
  # (src/orion/vision/captura.py), entao o valor abaixo virou string.
  # Latencia medida em 2026-07-28: ~36 fps efetivo, gap medio 28ms, sem
  # acumulo ao longo de 8s continuos.
  #
  # HISTORIA (2026-07-24 a 27, para ninguem repetir): antes desta mudanca o
  # valor era um indice /dev/videoN local, e a fonte de bugs era a DV20
  # sumir ou trocar de indice ao ser replugada - mesma classe do bug do
  # CH340 do Arduino migrando de ttyUSB0 para ttyUSB1 (ver docs/journal.md).
  # A URL fixa evita essa classe inteira de problema; so muda se a porta do
  # servico no Pi mudar.
  # 2026-10-31: a DV20 do pan/tilt mudou para a USB do NOTEBOOK (decisao de
  # 30/09: o video nao passa pela rede, so os eventos). O stream do Pi ficou
  # mostrando "NO SIGNAL" e a visao estava cega sem nenhum erro no log.
  # by-id e nao /dev/videoN: o indice muda conforme a ordem dos cabos.
  camera_indice_principal: "/dev/v4l/by-id/usb-Jieli_Technology_USB_Composite_Device-video-index0"
  camera_indice_luminosidade: 0 # camera integrada do notebook (estimativa de brilho)
  # NOTA: camera_indice_luminosidade nao e lido por nenhum codigo hoje
  # (verificado por grep em 2026-07-27) - e config morta, mantida so para
  # nao perder a intencao original. Se voltar a ser usada com uma camera so,
  # atencao: dois VideoCapture no mesmo indice brigam pelo dispositivo.
  # indices de /dev/videoN podem mudar se os cabos USB forem replugados em
  # outra ordem - conferir com `v4l2-ctl --list-devices` se a visao parecer
  # estar usando a camera errada.
  camera_frontal_espelhada: false
  # --- Vision Engine do Pi (motion_core/vision) -------------------------
  # Caminho do modelo YOLO no Raspberry e URL do stream da propria camera.
  yolo_model_path: "data/modelos/yolov8n.pt"
  # Engine de visao do PI desligado (2026-11-01): a camera esta no Notebook
  # e o stream :8091 nao existe mais. true so com camera no Pi.
  pi_engine_ativo: false
  camera_url_pi: "http://127.0.0.1:8091/stream"
  # FPS pedido ao laco do Pi (0 = sem limite, roda o mais rapido possivel).
  fps_pi: 0
  # YOLO principal do robo: todas as 80 classes nativas COCO.
  pi_classes_interesse: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic_light, fire_hydrant, stop_sign, parking_meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports_ball, kite, baseball_bat, baseball_glove, skateboard, surfboard, tennis_racket, bottle, wine_glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot_dog, pizza, donut, cake, chair, couch, potted_plant, bed, dining_table, toilet, tv, laptop, mouse, remote, keyboard, cell_phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors, teddy_bear, hair_drier, toothbrush]

  # Era `true` ate 2026-07-28, e estava CERTO enquanto a camera principal era
  # a INTEGRADA do notebook: aquela entrega o frame no efeito "selfie"
  # (espelhado), e `captura.py` desfazia com cv2.flip. Sem desfazer, o Pan/Tilt
  # giraria para o lado errado ao seguir uma pessoa.
  #
  # Hoje a camera principal e a DV20 montada no PAN/TILT, servida pela rede
  # (ver camera_indice_principal acima). Webcam USB em suporte NAO espelha
  # nada - o quadro ja chega correto. Com a flag em `true` o codigo espelhava
  # um frame que estava certo, e o bug que o comentario antigo descrevia
  # acontecia ao contrario: o usuario a ESQUERDA aparecia em cx=442 (direita
  # do quadro, erro +122 medido com conf=0.91), a visao mandava girar para a
  # direita, o firmware obedecia, e a camera FUGIA da pessoa. O relato foi
  # "fica maluco indo pra outra direcao".
  #
  # LICAO: esta flag descreve a FONTE da imagem, nao "a camera do robo".
  # Trocar camera_indice_principal obriga a revisitar esta linha - foi
  # exatamente o que nao se fez ao migrar para o stream de rede.
  #
  # A inversao dos servos NAO se resolve aqui: ela ja e tratada no firmware
  # (command_executor.h, SET_PAN_TILT, medida na bancada em 26/07), e o .hex
  # gravado no Mega e posterior a essa correcao. Nao inverter nos dois lugares.

voice:
  # Aceita um nome ou uma LISTA de nomes. "jarvis" entrou em 2026-09-17 a
  # pedido do dono ("quero que ele responda por Jarvis tambem") - os dois
  # chamam o robo, e ele continua se apresentando como Fofao.
  # So vale para a ATIVACAO POR VOZ: enquanto nao houver microfone ligado
  # (ver docs/journal.md), nenhum dos dois nomes e ouvido.
  # 2026-11-01: "boku" e "defai" a pedido do dono. Conferido que nao
  # disparam com boca, foco, desafio, de fato; casam com bocu e de fai.
  wake_word: ["jarvis"]
  # SEM PALAVRA DE ATIVACAO (2026-10-25, decisao do dono: "prefiro sem
  # palavra de ativacao"). false = a conversa fica sempre aberta e toda fala
  # vira comando; o wake_word acima so vale com true.
  #
  # RISCO, com numero: a cota gratis do Gemini e de 500 chamadas/dia, e ja
  # acabou uma vez em 3h30 (a IA estrategica a 30 s). Com false, CADA fala
  # aceita gasta uma - inclusive conversa entre outras pessoas, TV e radio.
  # Os portoes continuam na frente (VAD, transcricao vazia, alucinacao e eco
  # da propria voz). Se a cota voltar a acabar cedo, e aqui que se volta.
  # 2026-11-08, dono: "so com jarvis". O chat de 01-08/11 tinha dezenas de
  # respostas a conversa de fundo (TV, familia) transcrita como se fosse com
  # ele - "bingo de alias", "Coro do Fale". Volta a exigir o nome; depois do
  # "Jarvis" a conversa segue aberta ate 2 silencios.
  exigir_palavra_ativacao: true
  # MEDIDO EM 2026-08-05, nesta maquina, com audio de gabarito gerado pelo
  # proprio Piper (4 frases, resposta conhecida, servico rodando junto):
  #
  #     base    acertou 1 de 4    3,2 s por frase
  #     small   acertou 3 de 4    9,2 s por frase
  #
  #     base   ERRO  'Fofao, baila no quarto versao e comal esta'
  #     small  OK    'fofao, vai la no quarto ver se o Kamal esta'
  #
  # O `base` nao estava inventando ai - estava ERRANDO a fala de verdade, que
  # e o que sobrou depois que os portoes anti-invencao foram consertados
  # (96e96d9). O preco sao ~6 s a mais antes de o robo comecar a pensar.
  # DESFAZER E UMA LINHA: voltar para "base" aqui e reiniciar o servico.
  # 2026-10-31: small -> base. Medido no Notebook com YOLO+rosto rodando, frase
  # de 5 s: small 6,1 s (mais lento que a propria fala), base 2,0 s, mesmo
  # texto (os dois erram "Jarvis", que nao importa sem palavra de ativacao).
  # Dono: "a velocidade esta lenta". beam_size 5->1 nao muda nada (5,7 s).
  whisper_model: "base"
  # modelo das janelas de vigilancia da wake word. Testado "tiny" ao vivo
  # (2026-07-18): rapido, mas errava demais ("Fofão" virava "Loco"/"Fofa no")
  # e o robo nao acordava - com este mic, "base" e o minimo confiavel.
  # CONTINUA "base" DE PROPOSITO: esta janela roda o tempo todo, so para ver
  # se alguem disse "Fofao". Com o `small` (9 s por janela) o vigia nao
  # acompanharia a fala e ainda prenderia os 4 nucleos. O modelo grande so
  # entra depois que o robo ja acordou, para entender o PEDIDO.
  whisper_model_ativacao: "base"
  piper_voice: "pt_BR-faber-medium"
  piper_voice_path: "data/piper_voices/pt_BR-faber-medium.onnx"
  volume_percent: 70
  preferred_mic: "auto"          # auto | notebook | webcam
  # alto-falante interno e P2 (jack) ainda nao aparecem no audio do Linux
  # nesta montagem (falta driver/quirk do codec HDA) - a saida agora e a TV
  # conectada no HDMI do notebook ("HDA Intel PCH: Android TV", confirmada
  # falando em 2026-07-18). Indices sounddevice nao sao fixos - conferir
  # com `python -m sounddevice` se mudar as portas USB/HDMI.
  saida_audio_indice: 0  # Pi: bcm2835 Headphones (hw:2,0) - antes era 4 (HDMI do notebook)
  # indices de entrada (sounddevice) reconferidos em 2026-07-24: 2a webcam
  # (USB Composite Device) desconectada fisicamente hoje, sobrou PC Camera
  # (indice 3) e USB Audio Device (indice 4) - indices de audio mudam
  # conforme o que esta plugado, reconferir com sd.query_devices() se
  # o erro "Nenhum microfone candidato respondeu" voltar
  # RECONFERIDO 2026-07-27 (terceira vez que isto muda - ver padrao abaixo).
  # 3 = "USB Audio Device (hw:2,0)", o microfone USB de verdade, 1 canal.
  # 4 = "pulse" e 5 = "default" ficam como reserva: existem quase sempre, mas
  # podem capturar SILENCIO em vez de falhar, que e a armadilha desta secao.
  #
  # PADRAO QUE JA SE REPETIU 3 VEZES - leia antes de "consertar" isto:
  # os indices do sounddevice mudam sempre que um dispositivo USB e plugado
  # ou desplugado. Em 24/07 a 2a webcam saiu e os indices 0/1/5 viraram
  # saidas HDMI (o servico entrava em crash-loop com "Nenhum microfone
  # candidato respondeu"). Em 25/07 mudaram de novo ao religar. Em 27/07 a
  # DV20 (webcam USB, que TEM microfone) foi desconectada durante a
  # montagem e o indice 3 voltou a ser o mic USB.
  #
  # A falha de 27/07 foi PIOR de diagnosticar que a de 24/07, e vale saber
  # por que: com o indice 5 ("default") na lista, o seletor encontra um
  # dispositivo VALIDO que nao captura nada. Nao ha excecao, nao ha
  # crash-loop, o servico fica `active` - e o robo simplesmente nunca ouve.
  # Falha silenciosa. Sintoma: nenhuma linha "ouvi (rms=...)" no
  # journalctl, enquanto o resto (IA, avatar, link com o Pi) segue normal.
  #
  # Como reconferir: .venv/bin/python -c "import sounddevice as sd; print(sd.query_devices())"
  # e pegar o que tem max_input_channels > 0 E nome de hardware real.
  microfones_candidatos_indices: [3, 4, 5]
  # PORTAO ANTI-INVENCAO do Whisper (2026-07-29). Pedido do dono: "quando o
  # whisper nao entende ele inventa, isso e ruim" - e ele tem razao. Um
  # transcritor que fabrica e PIOR que um que cala, porque o robo AGE sobre a
  # invencao: decide, fala e se move a partir de uma frase que ninguem disse.
  #
  # Medido no mesmo dia: sobre ruido sem voz, este Whisper devolveu
  # 'O que e isso? O que e isso?' - frase gravada no banco desde 25/07. Ele
  # repetiu o passado, e a causa e o default `condition_on_previous_text=True`
  # da lib, agora desligado no codigo.
  #
  # Ate hoje a chamada era `transcribe(audio, language="pt")` e nada mais:
  # todos os freios que a lib oferece estavam desligados.
  transcricao:
    # Silero corta o que nao e fala ANTES de o modelo ver. Sem ruido para
    # interpretar, nao ha o que inventar. E o freio mais eficaz.
    vad_filter: true
    # Acima disto o proprio modelo diz "isto nao e fala" - segmento descartado.
    no_speech_threshold: 0.6
    # Log-probabilidade media por token; abaixo disto ele esta adivinhando.
    log_prob_threshold: -1.0
    # Texto repetitivo em laco tem razao de compressao alta - assinatura
    # classica da alucinacao.
    compression_ratio_threshold: 2.4
    # Diz ao modelo que esta palavra e esperada. Nao inventa nada: desempata
    # a favor dela quando o som esta no limite.
    # 08/11: tambem os comandos curtos. "me siga" saiu "e ciga", "Missiga" e
    # "Ouja" em tres testes seguidos - e comando curto e o que menos tem
    # contexto para o modelo acertar. So desempata; os portoes continuam.
    # 08/11 16:39: com os comandos de MOVIMENTO aqui o Whisper passou a tirar
    # a propria lista do ruido ("olha, olha, olha", "anda para frente, anda
    # para frente") - perigoso num robo que obedece. So o nome e o me siga.
    hotwords: "Jarvis, me siga"
  # OS OUVIDOS DE VERDADE DO FOFAO: dois microfones I2S num ESP32, que le os
  # dois a 16 kHz e despeja int16 LE intercalado num socket TCP.
  #
  # Ligado em 2026-07-29. Antes desta data o ESP32 transmitia corretamente -
  # medido, 768000 bytes em exatos 12,0 s - e NENHUMA LINHA do orion-os lia
  # esse socket: `grep` por "esp32", "9100" e "ouvidos" no projeto dava zero.
  # O robo ouvia os `microfones_candidatos_indices` acima, que sao placas
  # locais do Notebook, enquanto o dono falava no ESP32. Estava surdo por dois
  # caminhos ao mesmo tempo: a fonte certa sem leitor e o leitor na fonte
  # errada.
  #
  # `host` e NOME, nao IP, de proposito: o IP muda. Em 2026-07-29 o
  # 10.20.20.101 anotado no journal ja era o celular de alguem, e o ESP32
  # estava no .104 - quem procura por IP fixo encontra o aparelho errado.
  #
  # `habilitado: false` volta para os microfones locais sem tocar em codigo.
  ouvidos_esp32:
    # true de novo desde 2026-10-25: a tela ESP32-S3, cujo microfone ouvia
    # no lugar destes de 17/09 em diante, saiu do robo. Os ouvidos voltam a
    # ser o unico microfone (EDR-0036: falam direto com o Notebook).
    habilitado: true
    host: "ouvidos.local"
    porta: 9100
    # Quanto se espera o ESP32 aparecer no boot antes de cair para o
    # microfone local. Curto: se ele nao esta na rede agora, e melhor subir
    # com o mic paliativo do que atrasar o robo inteiro - e a reconexao
    # continua tentando em segundo plano de qualquer forma.
    timeout_boot_s: 6.0
  # Portao de atividade sonora (VAD) na frente do Whisper de vigilancia
  # (src/orion/voice/vad.py): janela de escuta sem som acima do ruido de
  # fundo nao e transcrita - poupa a CPU que o Whisper continuo consumia
  # (~165% medido em 2026-07-19). Piso de ruido e adaptativo (percentil
  # baixo do historico de RMS); "fator" = quantas vezes acima do piso o som
  # precisa estar; "rms_minimo" = limiar absoluto de seguranca para salas
  # muito silenciosas. Se o robo parar de acordar com "Fofao", abaixe o
  # fator (ex.: 1.8) ou desabilite para voltar ao comportamento antigo.
  vad:
    habilitado: true
    fator_acima_do_ruido: 2.5
    # 2026-10-31: 0.003 -> 0.03. O ganho dos ouvidos dobrou (firmware >>12) e
    # o ruido de fundo passou a ~0.013: com 0.003 o Whisper rodava a cada 5 s
    # em silencio. Voz medida a 0.15 - folga de 5x.
    # 2026-11-01: 0.03 -> 0.012. Robo remontado, mics em outro lugar: ruido
    # MEDIDO 0.007 e voz a 1 m entre 0.03 e 0.07 - a fala ficava em cima do
    # piso fixo e era descartada como silencio, sem log (ele "nao ouvia").
    # Com 0.012 quem decide e o adaptativo (2.5 x ruido ~ 0.018). Remontou de
    # novo? MECA antes de mexer aqui: o piso fixo nao acompanha a montagem.
    rms_minimo: 0.012
    janelas_de_historico: 30
  # IDENTIFICACAO DE LOCUTOR POR VOZ (2026-08-19, trazida do Notebook em
  # 2026-10-25): saber QUEM falou so pela voz, no nivel do reconhecimento
  # facial. O modelo (SpeechBrain ECAPA) roda no Notebook e compara a fala
  # atual com os voiceprints cadastrados por cosseno; o vencedor acima do
  # limiar publica voice.person_recognized, que o quem_fala credita igual ao
  # rosto - a conversa passa a ter dono mesmo quando a camera nao ve ninguem.
  #
  # `limiar_cosseno`: 0.5 e conservador (erra para NAO atribuir - mesma
  # regra do rosto). Se ele nao reconhecer ninguem na pratica, abaixe em
  # passos de 0.05; se trocar a voz de uma pessoa pela de outra, suba.
  #
  # `savedir`: onde o modelo baixado fica (nao baixar de novo a cada boot).
  # Sem voiceprint cadastrado nada acontece - a conversa segue "da casa".
  identificacao_locutor:
    habilitado: true
    limiar_cosseno: 0.5
    modelo: "speechbrain/spkrec-ecapa-voxceleb"
    savedir: ".cache_speechbrain"

ai:
  # IA REMOTA, E SO ELA (OpenRouter, API compativel com a da OpenAI).
  #
  # A reserva local (Ollama/gemma3:1b) SAIU EM 2026-08-05, por decisao do
  # dono. Ela existia para o robo nunca ficar mudo - e no dia em que foi
  # precisa nao funcionou: os creditos acabaram as 10:05, a queda para o
  # modelo local disparou como projetado, e a resposta nunca veio (60 s de
  # espera e "o Fofao nao respondeu a tempo"). Ainda segurava ~1 GB de RAM
  # numa maquina que ja carrega YOLO, reconhecimento facial e Whisper.
  #
  # CONSEQUENCIA A ENCARAR: sem internet ou sem credito, o robo DIZ que
  # esta sem pensar. Nao trava e nao emudece, mas tambem nao conversa. O
  # resto continua de pe: parar, a hora, o diario, a saudacao pelo nome e a
  # entrega de recado nao passam por modelo nenhum.
  #
  # O SALDO E DA CONTA, NAO DA CHAVE - os dois numeros enganam:
  #   curl https://openrouter.ai/api/v1/credits -H "Authorization: Bearer $OPENAI_API_KEY"
  # `limit_remaining` na chave pode estar cheio com a carteira zerada.
  openai_model: "gemini-flash-lite-latest"
  openai_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  # OPENAI_API_KEY vem de variavel de ambiente - nunca fixa aqui (regra 6).
  # O NOME diz OpenAI, o PROVEDOR e o Google: o que a chave precisa e falar
  # o protocolo da OpenAI, e o Gemini expoe um endpoint que fala. Renomear a
  # variavel para algo neutro fica pendente.
  #
  # POR QUE O `-lite`, E POR QUE NAO O `gemini-flash-latest` (medido 05/08):
  # o flash-latest PENSA antes de responder, e os tokens de pensamento
  # consomem o `max_tokens` sem aparecer na contagem de saida. Com os 100
  # de `resposta_max_tokens` ele devolvia 3 tokens e `finish_reason=length`
  # - frases cortadas no meio, e a resposta seguinte saia completando a
  # anterior em vez de responder a pergunta nova.
  #
  #   flash-latest       4,5s  saida=4   CORTADA
  #   + reasoning_effort=low   1,8s  saida=1   pior
  #   + thinking_budget=0      400 Bad Request (nao aceito aqui)
  #   flash-LITE-latest  0,7s  saida=8   completa
  #
  # Subir o teto resolveria o corte e quebraria a premissa: resposta curta
  # e o que faz o robo falar logo. O lite entrega as duas coisas.
  #
  # NOMES FIXOS NAO SERVEM NESTA CHAVE: `gemini-2.5-flash` responde 404
  # ("no longer available to new users") e `gemini-2.0-flash` responde 429
  # (cota). A cota do Gemini e POR MODELO - se um dia parar, varra os
  # modelos antes de culpar a chave.
  temperature: 0.6
  # resposta curta = falar logo (gerar + sintetizar demoram proporcional ao texto)
  resposta_max_tokens: 100
  system_prompt_file: "config/prompt_sistema.txt"
  # Modelo usado pelo Mentor de comportamento (behavior.mentor,
  # 2026-07-24) - mesmo base_url da conversa acima, so o modelo pode ser
  # diferente (aqui exige saida JSON estruturada: json_schema com enum).
  #
  # ESTA CHAVE TEM DE ANDAR JUNTO COM O `openai_base_url`. Em 05/08 o
  # base_url foi para o Google e este nome ficou na OpenRouter: 1737 erros
  # 404 em 33 h, um a cada 30 s, e o Mentor NUNCA opinou nesse periodo. Nao
  # apareceu como pane porque `aconselhar()` engole a excecao de proposito
  # e o robo segue pela regra - ele fica mudo de opiniao, nao quebrado.
  #
  # O `gemini-flash-latest` NAO serve aqui, pelo mesmo motivo da conversa:
  # ele pensa antes de responder e os tokens de pensamento consomem os 150
  # de `max_tokens` - medido 06/08, devolveu 'Here' e o validador descartou.
  mentor_model: "gemini-flash-lite-latest"

display:
  avatar:                        # tela do notebook (Cap 13)
    initial_mode: "AVATAR"
    brightness_percent: 80
    # DESCANSO DE TELA (2026-08-07). Ate esta data este numero era 15 e
    # NINGUEM o lia: o autostart do kiosk fazia `xset -dpms` e a tela nunca
    # dormia. Agora quem o le e `orion/display/tela.py`, pelo AvatarServer.
    #
    # Sao 3 minutos por pedido do dono, e a regra dele e mais forte que o
    # tempo: a tela fica APAGADA por padrao e so acende quando ha o que
    # mostrar (o quadro de aula, ou um pedido explicito). Estes 3 minutos
    # nao sao o gatilho principal - sao o FECHAMENTO: terminou de mostrar,
    # some sozinha.
    sleep_timeout_min: 3
    descanso_habilitado: true
    # Onde mora o X do kiosk. So a maquina da tela (o Notebook) tem um; onde
    # nao houver `xset`, o controle se declara inativo e nao faz nada.
    display_x: ":0.0"
  web:                           # servida pelo Raspberry (Cap 13)
    port: 8080
    # Porta do stream MJPEG (orion-camera-stream.service, ustreamer).
    # Fica aqui e nao no codigo porque o dashboard precisa dela no
    # navegador, e regra 6: numero de porta e config.
    #
    # O HOST nao aparece de proposito. O dashboard monta a URL com o
    # location.hostname da propria pagina, entao ela funciona igual pelo
    # IP da LAN, por pi-os.local ou por fofao-pi (Tailscale) - sem nada
    # para reconfigurar quando se acessa de fora de casa. Fixar o host
    # aqui quebraria justamente o acesso remoto (vision.camera_indice_
    # principal aponta para pi-os.local, que so resolve na LAN).
    camera_porta: 8091
    restricted_pages: ["CONFIGURACAO"]

diagnostics:
  metrics_interval_s: 5
  thresholds:
    cpu_warning_percent: 80
    cpu_critical_percent: 95
    ram_warning_percent: 85
    ram_critical_percent: 95
    cpu_temp_warning_c: 80
    cpu_temp_critical_c: 90
    disk_warning_percent: 85

database:                        # roda no Raspberry, SSD 500 GB (EDR-0019)
  path: "/mnt/ssd/orion/orion.db"
  backup_dir: "/mnt/ssd/orion/backups"
  replica_to_notebook: true      # replica cruzada diaria via Ethernet
  notebook_replica_dir: "data/backups_replica"
  # Vault Obsidian - memoria de longo prazo em texto livre (EDR-0021).
  # Mesmo disco do orion.db de proposito: ainda nao entra no backup/replica
  # diario (so cobre o .db por enquanto - pendente ver docs/edr/EDR-0021).
  obsidian_vault_dir: "/mnt/ssd/orion/obsidian_vault"
  backup_hour: 3                 # 03:00 diário
  retention:
    telemetria_days: 30
    eventos_days: 90
    logs_days: 30
    logs_error_days: 180

lighting:
  auto_flashlight: true
  brightness_threshold: 60       # brilho médio 0-255 abaixo do qual acende

connectivity:                    # offline-first: tudo opcional (EDR-0019)
  online_features_enabled: true  # habilita extras quando houver Internet
  remote_access: "pi_connect"    # acesso externo a interface web
  notifications:
    enabled: true                # avisos no celular em eventos criticos
    channel: "none"              # none | telegram | email (configurar)

# QUEM SÃO AS PESSOAS DA CASA, e o que elas são PARA ELE (2026-07-29).
#
# Definido pelo dono. Não é enfeite: o Fofão cumprimenta pelo nome e pela
# relação, e isso entra no contexto que a IA lê - ele precisa saber quem é
# quem antes de decidir como agir com cada um.
#
# Os nomes TÊM que bater com os cadastrados no banco (tabela `pessoas`), que é
# de onde o reconhecimento facial tira o nome. Nome que não bater aqui recebe
# o cumprimento genérico, sem erro.
familia:
  - nome: "João Paulo"
    relacao: "criador"
    descricao: "meu projetista e criador - quem me construiu"
  - nome: "Kamal"
    relacao: "irmao"
    descricao: "filho do João Paulo, e como um irmão para mim - tem 3 anos e ainda não escreve, então falo com ele por voz e gestos"
  - nome: "Marah"
    # Ela atende pelos tres (dito pelo dono em 2026-08-04). Sem esta lista, um
    # recado deixado para "Marisane" some: e guardado com um nome e procurado
    # com outro, e nenhuma regra de string liga os dois. "Mara" ja casava por
    # prefixo; "Marisane" nao casa com nada.
    apelidos: ["Mara", "Marisane"]
    relacao: "mae"
    descricao: "como uma mãe para mim - cuidadora e zeladora da casa"

security:
  authorized_users: []           # preenchido via interface
  restricted_actions: ["config.security", "database.restore"]
  child_safe_profile_on_detection: true

behavior:                        # Behavior Core / maestro (EDR-0020)
  ronda_automatica_intervalo_s: 0  # 2026-11-01: desligada - ronda so quando a IA escolher (dono: muito chefe)
  # Conselheiro de IA: o maestro pergunta ao Notebook o que fazer quando
  # esta ocioso. DESLIGADO por padrao desde 2026-07-19, e o motivo importa.
  #
  # Medido ao vivo: cada consulta custava uma QUEDA DO LINK TCP. A
  # inferencia do gemma3:1b satura os nucleos do notebook por ~20s; o
  # processo Python e preterido, os heartbeats atrasam e o Motion Core
  # declara o link morto. O asyncio.to_thread protege o event loop de
  # bloquear, mas nao protege de falta de CPU.
  #
  # Resultado: nenhum conselho entregue (a inferencia estourava ate o
  # timeout de 20s) e o link caindo a cada 2 minutos. Pior que nao ter.
  #
  # O codigo esta pronto e testado (236 testes). Para religar, basta
  # habilitado: true - mas antes resolva UMA das causas:
  #   - modelo/hardware mais rapido para a inferencia caber com folga;
  #   - ou tolerancia de heartbeat maior (communication.heartbeats_lost_
  #     threshold) para o link sobreviver a um pico de CPU;
  #   - ou rodar a inferencia com nice/cpulimit, deixando um nucleo livre
  #     para o loop de comunicacao.
  conselho_ia:
    habilitado: false
    intervalo_consulta_s: 120
  # Guardião de RAM do Notebook: o Pi vigia a memória livre reportada pelo
  # Notebook e pede alívio de carga antes do crash. Histerese: entra em
  # alerta abaixo do crítico, só sai ao voltar à folga (Cap 16).
  guardiao_ram:
    limiar_critico_mb: 700
    limiar_folga_mb: 1200
  # de quanto em quanto tempo o Notebook reporta sua RAM livre ao Pi.
  notebook_health_interval_s: 10
  # Vigília (Modo Sentinela): ao receber um alerta (barulho estranho ou
  # rosto desconhecido), o maestro assume o controle por este tempo -
  # orienta-se para a origem, pede foto e notifica - antes de liberar.
  vigilia:
    duracao_alerta_s: 8
  # INSTINTOS (2026-07-29, ideia do mantenedor): o robo olha para o proprio
  # sensor e diz se da para confiar, ANTES de decidir qualquer coisa com ele.
  #
  # A calibracao da bussola e gravada na EEPROM do Mega e sobrevive a reset -
  # calibra-se UMA vez por montagem. Este instinto nao recalibra de tempos em
  # tempos; ele percebe que a calibracao GUARDADA deixou de valer (bussola
  # movida, metal novo por perto, chassi trocado).
  bussola:
    # Limiar arbitrado pelo mantenedor: metade da oscilacao medida em
    # 2026-07-29 com a bussola SEM calibrar (8,18 e 12,36 graus de dispersao,
    # robo parado, motores desligados). Acerta no caso conhecido - hoje o
    # instinto dispararia, corretamente.
    #
    # O QUE AINDA NAO SE SABE: se uma bussola CALIBRADA nesta montagem fica
    # abaixo de 6. Ninguem mediu, porque o robo esta preso a cabos e nao pode
    # girar. Por isso o valor vem acompanhado das travas abaixo - com elas, um
    # limiar errado vira aviso repetido em vez de robo girando para sempre.
    dispersao_maxima_graus: 6.0
    amostras: 12                  # janela de medida, so com o robo parado
    tentativas_max: 2             # depois disto, avisa e para de tentar
    intervalo_minimo_s: 600       # 10 min entre tentativas de calibracao
    # DESLIGADO por padrao: pedir calibracao faz o robo GIRAR 25 s sozinho.
    # So ligar quando houver espaco confirmado em volta e o robo estiver solto
    # (sem cabos) - hoje ele nao esta.
    pedir_calibracao: false
  # Detector de rosto desconhecido (roda no Notebook, Cap 8): olha um frame
  # a cada intervalo_s; rosto que nao casa com a familia -> sentinela.alerta
  # + foto salva. cooldown_s evita repetir o alerta com o estranho no quadro.
  sentinela_visao:
    habilitado: true
    intervalo_s: 3
    cooldown_s: 30
    pasta_fotos: "data/sentinela"
  # IA estrategica (EDR-0022) - ocupa a vaga da antiga "Patrulha agendada"
  # (EDR-0020, nunca implementada). Consulta a IA em ritmo proprio (nunca
  # no tick de 200ms do maestro) e escolhe entre um vocabulario FECHADO -
  # a IA nunca aciona hardware direto (Cap 18).
  ia_estrategica:
    # DESLIGADA MOMENTANEAMENTE em 2026-08-07, por decisao do dono.
    #
    # POR QUE, com numero: naquele dia ela fez 505 chamadas ao modelo, tomou
    # 4 decisoes - todas `observar_ambiente` - e o robo nao saiu do lugar
    # nenhuma vez. Ela nao estava decidindo mal: nao havia o que decidir. Os
    # dois ultrassons devolvem -1 (sem eco), nao ha bussola e nao ha
    # encoder, entao o contexto que chega nela diz "NAO SEI a distancia" e a
    # unica saida sensata e "olhar" - que nao resolve, porque o sensor esta
    # mudo. Ela pergunta, ouve "olhe", olha, continua sem saber, e pergunta
    # de novo.
    #
    # O QUE ISSO CUSTAVA: a cota do tier gratuito do Gemini e de 500
    # requisicoes por DIA, e ela sozinha consumia 120 por HORA. A conta do
    # dia inteiro acabava as 10h da manha - e quem ficava sem era a
    # CONVERSA. O dono ouvia "nao consigo pensar" ao falar com o robo,
    # porque a funcao menos importante tinha gastado a cota da mais
    # importante.
    #
    # O QUE A TRAZ DE VOLTA (nao ligar antes, senao repete tudo):
    #   1. medida de distancia confiavel - o LiDAR STL-50B2 esperando o
    #      conversor, ou os ultrassons voltando a ecoar;
    #   2. e, de preferencia, billing no projeto do Google Cloud, que tira o
    #      teto de 500/dia.
    #
    # Ao religar, conferir tambem o `intervalo_s` abaixo: ele so faz sentido
    # em relacao ao orcamento do provedor da epoca.
    #
    # O QUE NAO SE PERDE COM ELA DESLIGADA: o maestro continua inteiro - o
    # Repouso, a Vigilancia de obstaculo, o Atender, a Ronda e o
    # AcompanharPessoa nao passam por modelo nenhum. O que para e so a
    # escolha discricionaria "o que eu faco agora, por conta propria".
    # RELIGADA 2026-11-01 a pedido do dono, com o retrato novo (LiDAR nos 4
    # lados, bussola, encoder, objetos da camera) e a trava do LiDAR nas
    # rodas. 300 s e nao 30: a cota gratis do Gemini (500/dia) e dividida com
    # a conversa - a 30 s ela acabou em 3h30. So dirige em modo AUTONOMO.
    # RELIGADA 2026-11-01 ~17:20 a pedido do dono, com o freio do EDR-0037
    # (trava 50 cm, frente cega = obstaculo), o desvio local no EXPLORE, a
    # frente do LiDAR corrigida (19) e 30% de velocidade. Desligada 16:27
    # depois de bater na comoda e na parede com a trava em so-avisa.
    habilitado: true
    intervalo_s: 300
    # So INTENCOES (2026-11-01, dono). Fora: andar_mm, girar_*_graus,
    # desviar_*_mm, avancar, virar_*, manobrar (manobra e do EXPLORE, que
    # desvia pelo LiDAR) e calibrar_bussola (gira o robo voltas a 70%).
    # 08/11: sem `observar_ambiente` - era o radar de ultrassom, que saiu do
    # robo; 251 falhas e 0 sucessos no banco, e a IA o escolhia em laco parado.
    # O LiDAR ja da a frente o tempo todo (navigation_core._leituras_do_lidar).
    acoes_permitidas: [explorar, seguir_pessoa, olhar_em_volta, parar, fotografar, acender_luz, apagar_luz, ligar_ventilador, desligar_ventilador]
    prioridade: 40
    # A CADENCIA TEM DE CABER NO ORCAMENTO DO PROVEDOR, e este numero mudou
    # de significado quando o provedor mudou.
    #
    # Era 30 s quando a IA vinha da OpenRouter, que cobra por TOKEN e nao
    # tem teto diario de requisicoes. Em 05/08 a conversa passou para o
    # Gemini e o `intervalo_s` ficou para tras - mesmo defeito do
    # `mentor_model`, que tambem nao acompanhou o `openai_base_url`.
    #
    # MEDIDO EM 07/08, com o robo mudo e o dono relatando "nao consigo
    # pensar": 30 s = 120 chamadas por HORA, e o tier gratuito do Gemini da
    # 500 por DIA (`generate_content_free_tier_requests`). A cota do dia
    # inteiro durava 3h30 - comecou 06:30 e acabou as 10:00, com 505
    # respostas 200 e 151 recusas 429 depois disso.
    #
    # Pior: quem paga a conta e a CONVERSA. O estrategico gastava tudo e o
    # robo respondia "nao consigo pensar" para quem falava com ele - a
    # funcao mais importante morrendo pela menos importante.
    #
    # 600 s = 144 chamadas por dia, deixando ~350 do teto para conversa,
    # saudacao e extracao de fatos. O robo pensa sozinho mais devagar, e
    # continua conversando - que e a troca certa.
    #
    # SE A CONTA FOR PAGA (billing no projeto do Google Cloud), este numero
    # pode voltar a cair: o limite deixa de ser 500/dia. Ate la, nao baixar
    # sem refazer a conta.
    intervalo_s: 600
    # O VOCABULARIO NAO MORA AQUI (2026-07-28, EDR-0026). O que a IA pode
    # fazer esta em motion_core/behavior/contrato.py, em codigo: e o limite
    # da autoridade dela sobre o robo, e limite de autoridade nao e
    # parametro de ajuste. Um acoes_validas no YAML deixaria qualquer edicao
    # de config alargar o poder da IA sem passar por revisao.
    pasta_fotos: "data/sentinela"
  # O Mentor foi FUNDIDO na ia_estrategica em 2026-07-28 (EDR-0026). Era a
  # mesma IA, no mesmo provedor (OpenRouter), perguntada de novo mais
  # devagar - e o conselho dele nunca virava acao. Com autoridade motora,
  # duas instancias da mesma IA disputariam as rodas em ritmos diferentes.
